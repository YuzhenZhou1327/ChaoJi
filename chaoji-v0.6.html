<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>巢记 · 免安装笔记本</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --line:#e0e0dc; --fg:#2b2b28; --muted:#8a8a84;
  --accent:#0f6f5c; --accent-soft:#e3f0ed; --danger:#b3402f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; overflow:hidden;}
button{font-family:inherit;}
/* ===== 顶栏 ===== */
#topbar{display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);}
#topbar .logo{font-weight:bold; color:var(--accent); font-size:16px;}
#topbar .filestate{font-size:12px; color:var(--muted);}
#topbar .spacer{flex:1;}
.btn{border:1px solid var(--line); background:var(--panel); padding:5px 12px; border-radius:5px; cursor:pointer; font-size:13px;}
.btn:hover{background:var(--accent-soft); border-color:var(--accent);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.primary:hover{opacity:.9;}
.btn.small{padding:2px 8px; font-size:12px;}
/* ===== 主体三栏 ===== */
#main{flex:1; display:flex; min-height:0;}
.col{overflow-y:auto; border-right:1px solid var(--line); background:var(--panel);}
.col1{width:230px; display:flex; flex-direction:column;}
.col2{width:240px;}
.col3{flex:1; display:flex; flex-direction:column; background:var(--bg);}
/* 左栏：笔记本+分区 */
.sect-head{padding:8px 12px 4px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.sect-head .add{cursor:pointer; color:var(--accent); font-size:15px; padding:0 4px;}
#nbList .item,#secList .item,#pgList .item{padding:6px 12px; font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:6px;}
#nbList .item:hover,#secList .item:hover,#pgList .item:hover{background:var(--accent-soft);}
#nbList .item.sel,#secList .item.sel,#pgList .item.sel{background:var(--accent-soft); color:var(--accent); font-weight:bold; border-left:3px solid var(--accent); padding-left:9px;}
.item .del{visibility:hidden; color:#bbb; font-size:12px;}
.item:hover .del{visibility:visible;}
.item .del:hover{color:var(--danger);}
#secList{flex:1; border-top:1px solid var(--line);}
/* ===== 左栏树形层级：笔记本(父) → 缩进分区(子) ===== */
#secHead{padding-left:26px;}                       /* 分区标题区随子级缩进 */
#nbList .item,#secList .item{padding:6px 12px;}
#secList .item{padding-left:34px; font-size:13px;}  /* 分区缩进 22px 表达从属 */
#secList .item .tree-mark{color:var(--muted); margin-right:6px; font-size:11px;}
#secList .item.sel{padding-left:31px;}
/* 页列表 */
#pgSearch{margin:8px 10px; width:calc(100% - 20px); padding:5px 9px; border:1px solid var(--line); border-radius:5px; font-size:13px;}
.col2{display:flex; flex-direction:column;}
#pgList{flex:1; overflow-y:auto;}
/* 编辑区 */
#editorWrap{flex:1; display:flex; flex-direction:column; min-height:0; padding:0 30px 40px; overflow-y:auto;}
#editorHead{position:sticky; top:0; z-index:20; background:var(--bg); padding:8px 0 4px; border-bottom:1px solid var(--line); margin-bottom:12px;}
#pgTitle{border:none; outline:none; font-size:24px; font-weight:bold; padding:10px 0 6px; background:transparent; color:var(--fg); width:100%;}
#editor{flex:1 0 auto; min-height:300px; outline:none; font-size:15px; line-height:1.7; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
#editor:focus{border-color:var(--accent);}
#editor img{max-width:100%;}
#editor a{color:var(--accent); text-decoration:underline; cursor:pointer;}
#editor blockquote{border-left:3px solid var(--accent); padding-left:12px; color:var(--muted); margin:6px 0;}
#editor h1{font-size:22px; margin:12px 0 6px; line-height:1.3;}
#editor h2{font-size:18px; margin:10px 0 5px; line-height:1.3;}
#editor h3{font-size:16px; margin:8px 0 4px;}
#editor h4{font-size:15px; margin:8px 0 4px; color:#3a3a36;}
#editor h5{font-size:14px; margin:6px 0 3px; color:#4a4a46;}
#editor h6{font-size:13px; margin:6px 0 3px; color:var(--muted);}
#editor code{font-family:Consolas,"Cascadia Mono",Monaco,"Courier New",monospace; font-size:.92em; background:#f2f1ec; color:#9c3b2e; border:1px solid #e4e2dc; border-radius:3px; padding:1px 5px;}
#editor pre{margin:10px 0; padding:12px 14px; background:#2c2c28; color:#ebebe6; border-radius:6px; overflow-x:auto; line-height:1.55;}
#editor pre code{display:block; background:transparent; color:inherit; padding:0; border:none; border-radius:0; font-size:13px; white-space:pre;}
#editor ul,#editor ol{padding-left:1.6em; margin:4px 0;}
#editor li{margin:2px 0;}
#editor ul ul,#editor ol ol,#editor ul ol,#editor ol ul{margin:2px 0;}
#editor table{border-collapse:collapse; margin:8px 0; width:auto; max-width:100%;}
#editor td,#editor th{border:1px solid var(--line); padding:6px 10px; min-width:48px;}
#editor th{background:var(--accent-soft); font-weight:bold;}
#toolbar{display:flex; gap:4px; padding:6px 0 2px; flex-wrap:wrap; align-items:center;}
#toolbar .btn{padding:3px 10px; font-size:12.5px;}
#toolbar select.btn{padding:3px 6px;}
/* 空状态 */
#emptyState{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; color:var(--muted); padding:40px;}
#emptyState h2{color:var(--fg); font-size:18px;}
/* 状态栏 */
#statusbar{display:flex; gap:16px; padding:4px 14px; font-size:12px; color:var(--muted); background:var(--panel); border-top:1px solid var(--line);}
#statusbar .warn{color:var(--danger);}
/* toast / 草稿横幅 */
#toast{position:fixed; bottom:44px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 18px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99;}
#draftBanner{display:none; padding:8px 14px; background:#fff6dd; border-bottom:1px solid #e8d48a; font-size:13px;}
#draftBanner button{margin-left:8px;}
::selection{background:#bfe0d8;}
#printArea{display:none;}
@media print {
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important; padding:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#000;}
  #printArea h1{font-size:20pt; margin:10pt 0 6pt;} #printArea h2{font-size:16pt; margin:8pt 0 5pt;}
  #printArea h3{font-size:13pt;} #printArea h4{font-size:12pt;} #printArea h5{font-size:11pt;} #printArea h6{font-size:10pt;}
  #printArea img{max-width:100%;}
  #printArea a{color:#000; text-decoration:underline;}
  #printArea blockquote{border-left:3pt solid #0f6f5c; padding-left:10pt; color:#555; margin:6pt 0;}
  #printArea code{font-family:Consolas,Monaco,monospace; background:#f4f4f4; padding:1pt 3pt; font-size:9pt;}
  #printArea pre{background:#f4f4f4; padding:8pt 10pt; white-space:pre-wrap; font-size:9pt; line-height:1.45;}
  #printArea pre code{background:none; padding:0;}
  #printArea ul,#printArea ol{padding-left:1.5em; margin:4pt 0;}
  #printArea li{margin:2pt 0;}
  #printArea table{border-collapse:collapse; width:100%; margin:8pt 0;}
  #printArea td,#printArea th{border:0.5pt solid #888; padding:4pt 6pt;}
  #printArea th{background:#eef4f2; font-weight:bold;}
  #printArea mark,#printArea [style*="background"]{background:#fff3a3 !important; color:#000;}
  #printArea hr{border:none; border-top:1pt solid #ccc; margin:8pt 0;}
}
#topbar .tb-group{display:flex; align-items:center; gap:6px;}
#topbar .tb-sep{width:1px; height:22px; background:var(--line); margin:0 4px;}
</style>
</head>
<body>
<div id="topbar">
  <span class="logo">巢记</span>
  <span class="filestate" id="fileState">未打开文件</span>
  <span class="spacer"></span>
  <div class="tb-group">
    <button class="btn" id="btnOpen" title="打开已有 .nbk 笔记本文件">📂 打开</button>
    <button class="btn" id="btnNew" title="新建空白笔记本（服务器模式存到数据目录；文件模式 Ctrl+S 时选位置）">➕ 新建</button>
    <button class="btn primary" id="btnSave" title="Ctrl+S，静默写回原文件">💾 保存</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="btn" id="btnImportMd" title="导入 Markdown（.md）文件为新页面">📥 导入 MD</button>
    <button class="btn" id="btnExportMenu" title="导出当前页 / 整本 / 备份">📤 导出 ▾</button>
  </div>
</div>

<div id="draftBanner">检测到上次会话的未保存草稿 <button class="btn small" id="draftRestore">恢复草稿</button> <button class="btn small" id="draftDiscard">丢弃</button></div>
<div id="handleBanner" style="display:none; padding:8px 14px; background:var(--accent-soft); border-bottom:1px solid var(--line); font-size:13px;"><span id="handleName" style="font-weight:bold;"></span> <button class="btn small" id="handleRestore">一点恢复</button> <button class="btn small" id="handleFileOnly" style="display:none">只要文件</button> <button class="btn small" id="handleForget">忘掉它</button> <span class="add" id="handleClose" title="关闭" style="cursor:pointer; margin-left:10px;">✕</span></div>

<div id="main">
  <div class="col col1">

    <div id="nbList"></div>
  <div class="sect-head" id="secHead">分区 <span class="add" id="addSec" title="在当前笔记本新建分区">＋</span></div>
    <div id="secList"></div>

    <div id="emptyState">
      <h2>巢记 · 免安装笔记本</h2>
      <p>数据保存在你自己的 <b>.nbk</b> 文件里，每次改动静默写回，不依赖浏览器缓存。</p>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="btnOpenOrNew">📂 打开已有笔记本</button>
        <button class="btn primary" id="btnNewBlank">➕ 新建笔记本</button>
      </div>
    </div>
    <div id="editorWrap" style="display:none;">
      <div id="editorHead">
      <div style="display:flex; align-items:baseline; gap:12px;">
        <input id="pgTitle" placeholder="页面标题">
        <span id="saveChip" style="font-size:11px; color:var(--muted); white-space:nowrap;"></span>
      </div>
      <div id="toolbar">
        <select class="btn" id="blockLevel" title="段落/标题级别">
          <option value="p">正文</option>
          <option value="h1">标题 1</option>
          <option value="h2">标题 2</option>
          <option value="h3">标题 3</option>

        </select>
        <button class="btn" data-cmd="bold"><b>B</b></button>

        <button class="btn" data-cmd="insertUnorderedList">• 列表</button>

</div>

<div id="statusbar">
  <span id="stSave">尚未打开文件</span>
  <span id="stDirty"></span>
  <span id="stCount"></span>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".nbk,application/json" style="display:none">
<input type="file" id="mdInput" accept=".md,.markdown,text/markdown,text/plain" style="display:none">
<div id="printArea"></div>

<script>
"use strict";
/* ================= 数据模型 =================
state = {app:"chaoji", ver:1, notebooks:[{id,name,sections:[{id,name,pages:[{id,title,html,created,updated}]}]}]}
*/
const APP = "chaoji";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = id => document.getElementById(id);

let state = null;
let sel = { nb: null, sec: null, pg: null };
let dirty = false;          // 有未写回的改动
let fileHandle = null;      // FileSystemFileHandle（授权后静默写回）
let lastSavedAt = null;
let serverMode = false;     // 服务器模式：保存走 POST /api/save
let serverFile = null;      // 服务器模式当前文件名

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  el.style.pointerEvents = "none";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; }, 2500);
}
/* 带「撤销」的提示（删除后悔药） */
function toastUndo(msg, onUndo) {
  const el = $("toast");
  el.innerHTML = "";
  el.style.opacity = 1;
  el.style.pointerEvents = "auto";
  const span = document.createElement("span");
  span.textContent = msg + " ";
  const btn = document.createElement("button");
  btn.textContent = "撤销";
  btn.style.cssText = "margin-left:10px; padding:2px 10px; cursor:pointer; border:1px solid #888; background:#fff; color:#222; border-radius:4px; font-size:12px;";
  btn.onclick = () => {
    el.style.opacity = 0; el.style.pointerEvents = "none";
    clearTimeout(toastTimer);
    onUndo();
  };
  el.appendChild(span); el.appendChild(btn);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = 0;
    el.style.pointerEvents = "none";
  }, 10000);
}
function relTime(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return new Date(ts).toLocaleDateString("zh-CN");
}

/* ---------- IndexedDB：会话衔接 + 草稿镜像（非持久层，.nbk 才是真相源） ----------
   keys: "session" -> {fileHandle, fileName, serverFile, lastSavedAt, dirty}
         "draft"   -> {state, savedAt, dirty}  |  兼容旧版纯 JSON 字符串 */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(APP, 1);
    r.onupgradeneeded = e => { e.target.result.createObjectStore("kv"); };
    r.onsuccess = e => res(e.target.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(val, key);
  } catch (e) { /* 静默：镜像失败不影响主流程 */ }
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return new Promise(res => {
      const tx = db.transaction("kv", "readonly");
      const q = tx.objectStore("kv").get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function idbDel(key) {
  try {
    const db = await idbOpen();
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(key);
  } catch (e) { /* ignore */ }
}
/* 兼容旧草稿：JSON 字符串 / {state,savedAt} / 裸 state 对象 */
function normalizeDraft(raw) {
  if (!raw) return null;
  if (typeof raw === "string") {
    try { return { state: JSON.parse(raw), savedAt: 0, dirty: true }; }
    catch (e) { return null; }
  }
  if (raw.state) return { state: raw.state, savedAt: raw.savedAt || 0, dirty: raw.dirty !== false };
  if (raw.app === APP) return { state: raw, savedAt: 0, dirty: true };
  return null;
}
/* 写回会话元数据（句柄可 structured-clone 进 IDB；失败不影响编辑） */
async function persistSession() {
  await idbSet("session", {
    fileHandle: fileHandle || null,
    fileName: fileHandle ? fileHandle.name : null,
    serverFile: serverMode ? serverFile : null,
    lastSavedAt: lastSavedAt ? lastSavedAt.getTime() : null,
    dirty: !!dirty
  });
}
/* 草稿镜像 + 会话 dirty 标记：防抖写，避免每键整本序列化 */
let snapTimer = null;
function scheduleSnapshot() {
  if (snapTimer) clearTimeout(snapTimer);
  snapTimer = setTimeout(async () => {
    snapTimer = null;
    if (!state) return;
    await idbSet("draft", { state, savedAt: Date.now(), dirty: !!dirty });
    await persistSession();
  }, 600);
}

/* ---------- 保存：主=静默写回句柄/服务器API；备=下载 ---------- */
async function saveToHandle(silent) {
  if (!fileHandle) return false;
  try {
    if (fileHandle.queryPermission && (await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
      if ((await fileHandle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("permission denied");
    }
    const w = await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(state)], { type: "application/json" }));
    await w.close();
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    persistSession();
    if (!silent) toast("✓ 已写回 " + fileHandle.name);
    return true;
  } catch (e) {
    if (!silent) toast("⚠ 写回失败：" + e.message + "，已改用下载备份");
    exportDownload();
    return false;
  }
}
/* 服务器模式保存：走 URL 路径协议 POST /api/save/<file>，body 即 state JSON
   （服务器 v2 无 json 依赖，把 JSON 解析留给浏览器） */
async function saveToServer(silent) {
  if (!serverMode || !serverFile) return false;
  try {
    const r = await fetch("/api/save/" + encodeURIComponent(serverFile), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "unknown");
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    persistSession();
    if (!silent) toast("✓ 已保存 " + serverFile);
    return true;
  } catch (e) {
    if (!silent) toast("⚠ 服务器保存失败：" + e.message);
    return false;
  }
}
const saveActive = silent => serverMode ? saveToServer(silent) : saveToHandle(silent);
function exportDownload() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: "application/json" }));
  a.download = (currentNbName() || "chaoji") + "-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "") + ".nbk";
  a.click();
  URL.revokeObjectURL(a.href);
  // 导出备份 ≠ 写回原文件：不得清除 dirty，否则关页不再拦截
  toast("✓ 已导出备份 " + a.download + (dirty ? "（原文件仍有未写回改动）" : ""));
  updateStatus();
}
const currentNbName = () => {
  const nb = state && state.notebooks.find(n => n.id === sel.nb);
  return nb ? nb.name : null;
};

/* ---------- 打开文件 ---------- */
async function openFile() {
  if (serverMode) return serverPickFile();
  if (!window.showOpenFilePicker) return legacyOpen();
  try {
    const [h] = await showOpenFilePicker({
      types: [{ description: "巢记笔记本", accept: { "application/json": [".nbk"] } }]
    });
    fileHandle = h;
    const file = await h.getFile();
    const text = await file.text();
    adoptState(JSON.parse(text), h.name);
    dirty = false; lastSavedAt = new Date();
    persistSession();
  } catch (e) {
    if (e.name !== "AbortError") toast("打开失败：" + e.message);
  }
}
/* 服务器模式：列表弹层选择/新建 .nbk（替代 prompt 序号） */
function pickNbkModal(items) {
  return new Promise(resolve => {
    const mask = document.createElement("div");
    mask.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:300; display:flex; align-items:center; justify-content:center;";
    const box = document.createElement("div");
    box.style.cssText = "background:#fff; border-radius:8px; width:min(420px, 92vw); max-height:70vh; display:flex; flex-direction:column; box-shadow:0 8px 28px rgba(0,0,0,.2);";
    const head = document.createElement("div");
    head.style.cssText = "padding:12px 16px; font-weight:bold; border-bottom:1px solid var(--line);";

/* 「打开」按钮：服务器模式走列表选择（openFile 内部分派），文件模式走系统对话框 */
async function serverLoadFile(name) {
  try {
    if (!name.endsWith(".nbk")) name += ".nbk";
    const r = await fetch("/api/load/" + encodeURIComponent(name));
    const j = await r.json();
    if (!j.ok) {
      if (r.status === 404) {  // 新文件：植入默认笔记本+分区并立即落盘（否则重开又 404）
        const fresh = { app: APP, ver: 1, notebooks: [newNb("我的笔记本")] };
        state = fresh;
        sel = { nb: fresh.notebooks[0].id, sec: fresh.notebooks[0].sections[0].id, pg: null };
        serverFile = name;
        $("fileState").textContent = name + "（服务器模式）";
        const sr = await fetch("/api/save/" + encodeURIComponent(name), {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state)
        });
        const sj = await sr.json();
        if (sj.ok) { dirty = false; lastSavedAt = new Date(); toast("✓ 已创建并打开 " + name); }
        else toast("⚠ 笔记本已打开但首次保存失败：" + (sj.error || ""));
        $("handleBanner").style.display = "none";
        renderAll(); updateStatus();
        persistSession();
        return;
      }
      throw new Error(j.error || "unknown");
    }
    serverFile = name;
    adoptState(j.state, name);
    $("fileState").textContent = name + "（服务器模式）";
    $("handleBanner").style.display = "none";
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    persistSession();
  } catch (e) { toast("打开失败：" + e.message); }
}

/* Word 专用净化：去掉交互残留（图片缩放角柄 style 由外层 overlay 不在 innerHTML 里，无需处理），保留内联样式 */
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function sanitizeForWord(html) {
  // 去脚本/事件属性，保留 img 的 data URI
  const d = document.createElement("div");
  d.innerHTML = html || "";
  d.querySelectorAll("script,style,iframe,object,embed").forEach(n => n.remove());
  d.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => { if (a.name.startsWith("on")) n.removeAttribute(a.name); });
    if (n.tagName === "IMG") {
      const w = n.style.width;
      if (w) n.setAttribute("width", parseInt(w, 10) || "");
      n.style.width && n.removeAttribute("style") ; // Word 对 style 里的尺寸支持有限，转 width 属性
    }
  });
  return d.innerHTML;
}

/* ================= Markdown 导入/导出（零依赖；格式只由工具栏操作） ================= */
function mdInlineToHtml(s) {
  let x = escHtml(s);
  x = x.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, "<img alt=\"$1\" src=\"$2\">");
  x = x.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a href=\"$2\">$1</a>");
  x = x.replace(/`([^`]+)`/g, "<code>$1</code>");
  x = x.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  x = x.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  x = x.replace(/~~([^~]+)~~/g, "<s>$1</s>");
  return x;
}
function mdToHtml(md) {

    while (listStack.length && listStack[listStack.length - 1].indent > toIndent) {
      const top = listStack.pop();
      out.push(top.type === "ul" ? "</ul>" : "</ol>");
      if (top.liOpen) out.push("</li>");
    }
    if (listStack.length && listStack[listStack.length - 1].liOpen && listStack[listStack.length - 1].indent === toIndent) {
      out.push("</li>");
      listStack[listStack.length - 1].liOpen = false;
    }
  };
  const flushP = (buf) => {
    if (buf.length) { out.push("<p>" + mdInlineToHtml(buf.join(" ")) + "</p>"); buf.length = 0; }
  };
  let para = [];
  const closeSiblingLi = () => {
    if (listStack.length && listStack[listStack.length - 1].liOpen) {
      out.push("</li>");
      listStack[listStack.length - 1].liOpen = false;
    }
  };
  while (i < lines.length) {
    const raw = lines[i];
    if (raw.trim().startsWith("```")) {
      if (inCode) {
        out.push("<pre><code>" + escHtml(codeBuf.join("\n")) + "</code></pre>");
        codeBuf = []; inCode = false;
      } else {
        flushP(para); closeLists(); inCode = true;
      }
      i++; continue;
    }
    if (inCode) { codeBuf.push(raw); i++; continue; }
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) { flushP(para); closeLists(); i++; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushP(para); closeLists();
      const lv = Math.min(6, h[1].length);
      out.push("<h" + lv + ">" + mdInlineToHtml(h[2]) + "</h" + lv + ">");
      i++; continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line.trim())) {
      flushP(para); closeLists(); out.push("<hr>"); i++; continue;
    }
    const bq = line.match(/^>\s?(.*)$/);
    if (bq) {
      flushP(para); closeLists();
      out.push("<blockquote><p>" + mdInlineToHtml(bq[1]) + "</p></blockquote>");
      i++; continue;
    }
    const li = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (li) {
      flushP(para);
      const indent = Math.floor(li[1].replace(/\t/g, "  ").length / 2);
      const type = /\d/.test(li[2]) ? "ol" : "ul";
      while (listStack.length && listStack[listStack.length - 1].indent > indent) {
        const top = listStack.pop();
        out.push(top.type === "ul" ? "</ul>" : "</ol>");
        if (top.liOpen) out.push("</li>");
      }
      if (!listStack.length || listStack[listStack.length - 1].indent < indent) {
        if (listStack.length && listStack[listStack.length - 1].liOpen) {
          // nested into open li
        } else if (listStack.length) {
          if (out[out.length - 1] === "</li>") out.pop();
          listStack[listStack.length - 1].liOpen = true;
        }
        out.push(type === "ul" ? "<ul>" : "<ol>");
        listStack.push({ type, indent, liOpen: false });
      } else if (listStack[listStack.length - 1].type !== type) {
        const top = listStack.pop();
        out.push(top.type === "ul" ? "</ul>" : "</ol>");
        if (top.liOpen) out.push("</li>");
        out.push(type === "ul" ? "<ul>" : "<ol>");
        listStack.push({ type, indent, liOpen: false });
      } else {
        closeSiblingLi();
      }
      out.push("<li>" + mdInlineToHtml(li[3]));
      listStack[listStack.length - 1].liOpen = true;
      i++; continue;
    }
    const isTableRow = (ln) => ln.trim().startsWith("|") && ln.trim().endsWith("|");
    const splitRow = (ln) => ln.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
    if (isTableRow(line) && i + 1 < lines.length && /\|?[\s:|-]+\|?/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
      flushP(para); closeLists();

      const rows = [];
      while (i < lines.length && isTableRow(lines[i]) && lines[i].trim()) {
        rows.push(splitRow(lines[i]));
        i++;
      }
      out.push("<table><thead><tr>" + head.map(c => "<th>" + mdInlineToHtml(c) + "</th>").join("") + "</tr></thead><tbody>");
      rows.forEach(r => {
        out.push("<tr>" + head.map((_, ci) => "<td>" + mdInlineToHtml(r[ci] || "") + "</td>").join("") + "</tr>");
      });
      out.push("</tbody></table>");
      continue;
    }
    closeLists();
    para.push(line.trim());
    i++;
  }
  if (inCode && codeBuf.length) out.push("<pre><code>" + escHtml(codeBuf.join("\n")) + "</code></pre>");
  flushP(para); closeLists();
  return out.join("");
}
function htmlToText(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  d.querySelectorAll("script,style").forEach(n => n.remove());
  d.querySelectorAll("table").forEach(tbl => {
    const rows = [...tbl.querySelectorAll("tr")].map(tr =>
      [...tr.children].filter(c => c.tagName === "TD" || c.tagName === "TH").map(c => (c.textContent || "").trim())
    );
    const cols = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const widths = Array.from({ length: cols }, (_, i) => rows.reduce((m, r) => Math.max(m, (r[i] || "").length), 0));
    const text = rows.map(r => {
      const cells = r.slice();
      while (cells.length < cols) cells.push("");
      return cells.map((c, i) => (c + " ".repeat(widths[i])).slice(0, widths[i])).join("  ");
    }).join("\n") + "\n";
    tbl.replaceWith(document.createTextNode(text));
  });
  d.querySelectorAll("p,div,br,li,h1,h2,h3,h4,h5,h6,blockquote,pre").forEach(n => {
    n.appendChild(document.createTextNode("\n"));
  });
  return (d.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
}
function htmlToMd(html) {
  const root = document.createElement("div");
  root.innerHTML = html || "";
  function inlineMd(node) {
    if (node.nodeType === 3) return node.nodeValue.replace(/\n+/g, " ");
    if (node.nodeType !== 1) return "";
    const tag = node.tagName;
    const kids = () => [...node.childNodes].map(inlineMd).join("");
    if (tag === "BR") return "\n";
    if (tag === "STRONG" || tag === "B") return "**" + kids().trim() + "**";
    if (tag === "EM" || tag === "I") return "*" + kids().trim() + "*";
    if (tag === "S" || tag === "DEL" || tag === "STRIKE") return "~~" + kids().trim() + "~~";
    if (tag === "CODE") return "`" + node.textContent + "`";
    if (tag === "A") return "[" + kids() + "](" + (node.getAttribute("href") || "") + ")";
    if (tag === "IMG") return "![" + (node.getAttribute("alt") || "") + "](" + (node.getAttribute("src") || "") + ")";
    return kids();
  }
  function blockMd(node, depth) {
    if (node.nodeType === 3) return node.nodeValue.trim() ? inlineMd(node) + "\n\n" : "";
    if (node.nodeType !== 1) return "";
    const tag = node.tagName;
    const pad = "  ".repeat(depth);
    if (/^H[1-6]$/.test(tag)) return pad + "#".repeat(+tag[1]) + " " + inlineMd(node).trim() + "\n\n";
    if (tag === "P") return pad + inlineMd(node).trim() + "\n\n";
    if (tag === "HR") return "---\n\n";
    if (tag === "PRE") return "```\n" + node.textContent.replace(/\n$/, "") + "\n```\n\n";
    if (tag === "BLOCKQUOTE") {
      const inner = [...node.childNodes].map(n => blockMd(n, 0)).join("").trim().split("\n").map(l => "> " + l).join("\n");
      return inner + "\n\n";
    }
    if (tag === "TABLE") {
      const rows = [...node.querySelectorAll("tr")];
      if (!rows.length) return "";
      const grid = rows.map(tr => [...tr.children].filter(c => c.tagName === "TD" || c.tagName === "TH")
        .map(c => inlineMd(c).replace(/\|/g, "\\|").replace(/\n/g, " ").trim()));
      const cols = Math.max(...grid.map(r => r.length));
      const norm = grid.map(r => { const x = r.slice(); while (x.length < cols) x.push(""); return x; });
      const line = cells => "| " + cells.join(" | ") + " |";
      return [line(norm[0]), line(norm[0].map(() => "---"))].concat(norm.slice(1).map(line)).join("\n") + "\n\n";
    }
    if (tag === "UL" || tag === "OL") {
      let n = 0;
      return [...node.children].filter(el => el.tagName === "LI").map(li => {
        n++;
        const mark = tag === "OL" ? n + ". " : "- ";
        const parts = [...li.childNodes];
        let head = "", sub = [];
        parts.forEach(ch => {
          if (ch.nodeType === 1 && (ch.tagName === "UL" || ch.tagName === "OL")) sub.push(ch);
          else head += inlineMd(ch);
        });
        let s = pad + mark + head.trim() + "\n";
        sub.forEach(ul => { s += blockMd(ul, depth + 1); });
        return s;
      }).join("") + (depth === 0 ? "\n" : "");
    }

/* ---------- 自定义右键菜单 ----------

let ctxEl = null;
function ctxMenu(e, items) {
  if (e && e.preventDefault) e.preventDefault();
  closeCtx();
  const m = document.createElement("div");
  m.style.cssText = "position:fixed; z-index:200; background:#fff; border:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.18); border-radius:6px; padding:4px 0; min-width:140px; font-size:13px;";
  items.forEach(([label, fn]) => {
    const it = document.createElement("div");
    if (fn === null) { it.style.cssText = "border-top:1px solid var(--line); margin:3px 8px; padding:0; pointer-events:none;"; m.appendChild(it); return; }
    it.textContent = label;
    it.style.cssText = "padding:7px 16px; cursor:pointer; white-space:nowrap;";
    it.onmouseenter = () => it.style.background = "var(--accent-soft)";
    it.onmouseleave = () => it.style.background = "";
    it.onclick = () => { closeCtx(); fn(); };
    // 防止点菜单项时 mousedown 先冒泡被外层当成「点外面」
    it.onmousedown = ev => ev.stopPropagation();
    m.appendChild(it);
  });
  document.body.appendChild(m);
  // 贴边翻转：防菜单超出视口
  const r = m.getBoundingClientRect();
  let x = e.clientX, y = e.clientY;
  if (x + r.width > window.innerWidth - 6) x = window.innerWidth - r.width - 6;
  if (y + r.height > window.innerHeight - 6) y = window.innerHeight - r.height - 6;
  m.style.left = x + "px"; m.style.top = y + "px";
  ctxEl = m;
}
function closeCtx() { if (ctxEl) { ctxEl.remove(); ctxEl = null; } }
document.addEventListener("mousedown", e => {

}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCtx(); });
window.addEventListener("blur", closeCtx);

const stripTags = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent; };
/* 搜索用正文缓存：按页 id + html 引用失效，避免每键 DOM 解析 */
const textCache = new Map();

/* ---------- Tab：列表内嵌套/反嵌套；非列表无选区插入两空格 ---------- */
function ctxBlockTag(node) {
  const ed = $("editor");
  let n = node;
  if (n && n.nodeType === 3) n = n.parentElement;
  while (n && n !== ed) {
    if (n.nodeType === 1) {
      const t = n.tagName;
      if (t === "LI" || t === "BLOCKQUOTE" || t === "H1" || t === "H2" || t === "P" || t === "DIV" || t === "PRE") return t;
    }
    n = n.parentElement;
  }
  return null;
}

  const p = document.createElement("p");

  el.parentNode.replaceChild(p, el);

$("editor").addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  e.preventDefault(); e.stopPropagation();
  const selEd = window.getSelection();
  const tag = selEd.anchorNode ? ctxBlockTag(selEd.anchorNode) : null;
  if (tag === "LI") {
    // 列表项：Tab 变二级（indent），Shift+Tab 回一级（outdent）
    document.execCommand(e.shiftKey ? "outdent" : "indent", false, null);
  } else if (e.shiftKey) {
    document.execCommand("outdent", false, null);
  } else if (selEd.isCollapsed) {
    document.execCommand("insertText", false, "  ");
  } else {
    document.execCommand("indent", false, null);
  }
  const p = findPage();
  if (p) { p.html = $("editor").innerHTML; markDirty(); }
});

}
/* 输入防抖：停手约 1s 后写回；另有 30s 兜底定时器 */
let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    if (dirty && (fileHandle || (serverMode && serverFile))) await saveActive(true);
  }, 1000);
}

/* 行内代码 / 代码块 — 仅工具栏 */
function wrapInlineTag(tag) {
  const sel = window.getSelection();
  $("editor").focus();
  if (!sel.rangeCount) return;
  const text = sel.isCollapsed ? "" : String(sel);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  if (text) {
    document.execCommand("insertHTML", false, "<" + tag + ">" + esc(text) + "</" + tag + ">");
  } else {
    document.execCommand("insertHTML", false, "<" + tag + ">&#8203;</" + tag + ">");
  }
}
function unwrapNode(el) {
  const parent = el.parentNode;
  if (!parent) return;
  while (el.firstChild) parent.insertBefore(el.firstChild, el);
  parent.removeChild(el);
}
function findAncestorTag(tag) {
  const sel = window.getSelection();
  let n = sel && sel.anchorNode;
  if (n && n.nodeType === 3) n = n.parentElement;
  while (n && n !== $("editor")) {
    if (n.nodeType === 1 && n.tagName === tag) return n;
    n = n.parentElement;
  }
  return null;
}

$("btnCodeBlock").onclick = () => {
  $("editor").focus();
  const pre = findAncestorTag("PRE");
  if (pre) {
    // 已在代码块上 → 取消，恢复为普通段落
    const lines = (pre.textContent || "").replace(/\n$/, "").split("\n");
    const frag = document.createDocumentFragment();
    (lines.length ? lines : [""]).forEach(line => {
      const p = document.createElement("p");
      p.textContent = line || "​";
      frag.appendChild(p);
    });
    pre.parentNode.replaceChild(frag, pre);
    const p0 = findPage();
    if (p0) { p0.html = $("editor").innerHTML; markDirty(); }
    return;
  }
  const sel = window.getSelection();
  const text = sel && !sel.isCollapsed ? String(sel) : "在这里输入代码";
  const preEl = document.createElement("pre");
  const code = document.createElement("code");
  code.textContent = text;
  preEl.appendChild(code);
  const after = document.createElement("p");
  after.appendChild(document.createElement("br"));
  const wrap = $("editorWrap");
  const scrollTop = wrap ? wrap.scrollTop : 0;
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(after);
    range.insertNode(preEl);
    const caret = document.createRange();
    caret.selectNodeContents(code);
    caret.collapse(false);
    sel.removeAllRanges();
    sel.addRange(caret);
  } else {
    $("editor").appendChild(preEl);
    $("editor").appendChild(after);
  }
  if (wrap) wrap.scrollTop = scrollTop;
  const p = findPage();
  if (p) { p.html = $("editor").innerHTML; markDirty(); }
};
function saveEditorRange() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  return $("editor").contains(r.commonAncestorContainer) ? r.cloneRange() : null;
}
function insertNodesAtEditor(nodes, range) {
  const wrap = $("editorWrap");
  const scrollTop = wrap ? wrap.scrollTop : 0;
  $("editor").focus({ preventScroll: true });
  const sel = window.getSelection();
  let r = range;
  if (!r) {
    r = document.createRange();
    r.selectNodeContents($("editor"));
    r.collapse(false); // 末尾
  }
  r.deleteContents();
  let last = null;
  // 逆序插入，保证顺序
  for (let i = nodes.length - 1; i >= 0; i--) {
    r.insertNode(nodes[i]);
    last = nodes[i];
    r.setStartBefore(nodes[i]);
  }
  if (last) {
    const caret = document.createRange();
    caret.setStartAfter(last);
    caret.collapse(true);
    sel.removeAllRanges();
    sel.addRange(caret);
  }
  // 保持滚动位置，避免跳到编辑区顶部
  if (wrap) wrap.scrollTop = scrollTop;
  if (last && last.scrollIntoView) last.scrollIntoView({ block: "nearest", inline: "nearest" });
}
function buildTableHtml(cols, rows) {
  let html = "<table><thead><tr>";
  for (let c = 0; c < cols; c++) html += "<th><br></th>";
  html += "</tr></thead><tbody>";
  for (let r = 0; r < rows - 1; r++) {
    html += "<tr>";
    for (let c = 0; c < cols; c++) html += "<td><br></td>";
    html += "</tr>";
  }
  return html + "</tbody></table>";
}
/* 表格行列操作 */
let lastTableCell = null;
function currentCell() {
  const sel = window.getSelection();
  let n = sel && sel.anchorNode;
  if (n && n.nodeType === 3) n = n.parentElement;
  const fromSel = n && n.closest ? n.closest("td,th") : null;
  if (fromSel) { lastTableCell = fromSel; return fromSel; }
  return lastTableCell && lastTableCell.isConnected ? lastTableCell : null;
}
function tableOp(op) {
  const cell = currentCell();
  if (!cell) return toast("请先把光标点进表格单元格");
  const tr = cell.parentElement;
  const table = cell.closest("table");
  const colIdx = [...tr.children].indexOf(cell);
  const sync = () => {
    const p = findPage();
    if (p) { p.html = $("editor").innerHTML; markDirty(); }
  };
  if (op === "rowBelow" || op === "rowAbove") {
    const nr = document.createElement("tr");
    const cols = tr.children.length || 1;
    for (let i = 0; i < cols; i++) nr.appendChild(document.createElement("td"));
    nr.children[Math.min(colIdx, cols - 1)].innerHTML = "<br>";
    if (op === "rowAbove") tr.parentNode.insertBefore(nr, tr);
    else tr.parentNode.insertBefore(nr, tr.nextSibling);
    lastTableCell = nr.children[Math.min(colIdx, cols - 1)];
  } else if (op === "colLeft" || op === "colRight") {
    let newCell = null;
    [...table.querySelectorAll("tr")].forEach(row => {
      const ref = row.children[colIdx];
      if (!ref) return;
      const nc = document.createElement(ref.tagName);
      nc.innerHTML = "<br>";
      if (op === "colLeft") row.insertBefore(nc, ref);
      else row.insertBefore(nc, ref.nextSibling);
      if (row === tr) newCell = nc;
    });
    if (newCell) lastTableCell = newCell;
  } else if (op === "delRow") {
    const total = table.querySelectorAll("tr").length;
    if (total <= 1) return toast("至少保留一行");
    const fallback = tr.previousElementSibling || tr.nextElementSibling;
    tr.remove();
    lastTableCell = fallback ? fallback.querySelector("td,th") : null;
  } else if (op === "delCol") {
    const colCount = tr.children.length;
    if (colCount <= 1) return toast("至少保留一列");
    [...table.querySelectorAll("tr")].forEach(row => {
      if (row.children[colIdx]) row.children[colIdx].remove();
    });
    const row2 = table.querySelector("tr");
    lastTableCell = row2 ? (row2.children[Math.max(0, colIdx - 1)] || row2.children[0]) : null;
  }
  sync();
}

function openHref(href) {
  try {
    if (/^javascript:/i.test(href)) return toast("不支持的链接");
    window.open(href, "_blank", "noopener,noreferrer");
  } catch (e) { toast("无法打开链接：" + e.message); }
}

function compressImage(file) {
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const MAX = 1280;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = () => { // 压缩失败退回原始读法
      URL.revokeObjectURL(url);
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
    };
    img.src = url;
  });
}

/* ---------- 启动：服务器探测 → 会话/句柄恢复 → 草稿衔接 ----------
   横幅约定：任一时刻最多一条恢复横幅（句柄优先，草稿仅在无句柄时独立出现） */
function hideRecoverBanners() {
  $("handleBanner").style.display = "none";
  $("draftBanner").style.display = "none";
}
function draftIsNewer(sess, draftRaw) {
  const d = normalizeDraft(draftRaw);
  return !!(d && d.state && d.state.app === APP && d.dirty && (d.savedAt || 0) > ((sess && sess.lastSavedAt) || 0));
}
/* applyDraft=true 时把未写回草稿一并套用（用户点「一点恢复」默认要最新内容） */
async function restoreFromSession(sess, draftRaw, applyDraft) {
  const h = sess && sess.fileHandle;
  if (!h) return false;
  try {
    if (h.queryPermission) {
      const p = await h.queryPermission({ mode: "readwrite" });
      if (p !== "granted") {
        if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") {
          toast("未授权访问该文件，请再点「一点恢复」或手动打开");
          return false;
        }
      }
    }
    fileHandle = h;
    const text = await (await h.getFile()).text();
    const obj = JSON.parse(text);
    if (!obj || obj.app !== APP) {
      fileHandle = null;
      toast("文件不是有效的巢记笔记本");
      return false;
    }
    const d = normalizeDraft(draftRaw);
    const useDraft = applyDraft && draftIsNewer(sess, draftRaw);
    adoptState(useDraft ? d.state : obj, h.name + (useDraft ? "（含未写回改动）" : ""));
    fileHandle = h;
    lastSavedAt = sess.lastSavedAt ? new Date(sess.lastSavedAt) : null;
    dirty = useDraft ? true : !!sess.dirty;
    hideRecoverBanners();
    updateStatus();
    persistSession();
    scheduleSnapshot();
    if (dirty) scheduleSave();
    return true;
  } catch (e) {
    fileHandle = null;
    toast("恢复上次笔记本失败：" + e.message + "，可手动打开 .nbk");
    return false;
  }
}

(async () => {
  // 1) 探测服务器模式
  try {
    const r = await fetch("/api/ping", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j.ok && j.mode === "server") {
        serverMode = true;
        $("fileState").textContent = "服务器模式 · 数据目录 " + j.dataDir;
        updateStatus();
        const sess = await idbGet("session");
        if (sess && sess.serverFile) {
          await serverLoadFile(sess.serverFile);   // 刷新后续写同一 .nbk
        } else {
          $("handleBanner").style.display = "block";
          $("handleName").textContent = "服务器模式：选择或新建 .nbk";
          $("handleRestore").textContent = "📂 选择笔记本";
          $("handleRestore").onclick = () => serverPickFile();
          $("handleFileOnly").style.display = "none";
          $("handleForget").style.display = "none";
        }
        return;
      }
    }
  } catch (e) { /* 非 http 或服务未起，走文件模式 */ }

  // 2) 文件模式：句柄与草稿合并为一条横幅，绝不叠两条
  const sess = await idbGet("session");
  const draftRaw = await idbGet("draft");
  const newerDraft = draftIsNewer(sess, draftRaw);

  if (sess && sess.fileHandle) {
    let perm = "unknown";
    try {
      if (sess.fileHandle.queryPermission) {
        perm = await sess.fileHandle.queryPermission({ mode: "readwrite" });
      }
    } catch (e) { perm = "unknown"; }

    if (perm === "granted") {
      // 已授权：直接续上；若有更新草稿则默认套用（用户刷新前多半在改这份）
      const ok = await restoreFromSession(sess, draftRaw, newerDraft);
      if (ok) return;
    }
    // 需用户手势授权 → 单条横幅承载全部恢复选项
    $("draftBanner").style.display = "none";
    $("handleBanner").style.display = "block";
    const name = sess.fileName || sess.fileHandle.name || "上次笔记本";
    $("handleName").textContent = "检测到上次打开的笔记本：" + name + (newerDraft ? "（含未写回改动）" : "");
    $("handleRestore").textContent = newerDraft ? "一点恢复（含未写回）" : "一点恢复（免选文件）";
    $("handleRestore").onclick = async () => {
      const ok = await restoreFromSession(sess, draftRaw, true);
      if (ok) toast("✓ 已恢复 " + name + (newerDraft ? "（含未写回改动）" : ""));
    };
    if (newerDraft) {
      $("handleFileOnly").style.display = "";
      $("handleFileOnly").onclick = async () => {
        const ok = await restoreFromSession(sess, draftRaw, false);
        if (ok) {
          idbSet("draft", { state, savedAt: Date.now(), dirty: false });
          toast("✓ 已恢复 " + name + "（丢弃未写回改动）");
        }
      };
    } else {
      $("handleFileOnly").style.display = "none";
    }
    $("handleForget").style.display = "";
    $("handleForget").onclick = async () => {
      await idbDel("session");
      if (newerDraft) await idbSet("draft", { app: "empty", savedAt: Date.now() });
      hideRecoverBanners();
      toast("已忘掉上次文件" + (newerDraft ? "与未写回草稿" : "") + "，请手动打开 .nbk");
    };
    return;   // 有句柄就不再走独立草稿横幅
  }

  // 3) 仅草稿（无句柄）：这才单独出草稿横幅
  const d = normalizeDraft(draftRaw);
  if (d && d.state && d.state.app === APP && state === null) {
    $("handleBanner").style.display = "none";
    $("draftBanner").style.display = "block";
    $("draftRestore").onclick = () => {
      adoptState(d.state, "上次草稿（未关联文件）");
      dirty = true;
      updateStatus();
      scheduleSnapshot();
      scheduleSave();
      $("draftBanner").style.display = "none";
    };
    $("draftDiscard").onclick = () => {
      $("draftBanner").style.display = "none";
      idbSet("draft", { app: "empty", savedAt: Date.now() });
    };
  }
})();
function initBlank() {
  state = { app: APP, ver: 1, notebooks: [] };   // 空壳，不塞默认笔记本（由调用方决定建什么）
  renderAll();
}
</script>
