<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>巢记 · 免安装笔记本</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --line:#e0e0dc; --fg:#2b2b28; --muted:#8a8a84;
  --accent:#0f6f5c; --accent-soft:#e3f0ed; --danger:#b3402f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; overflow:hidden;}
button{font-family:inherit;}
/* ===== 顶栏 ===== */
#topbar{display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);}
#topbar .logo{font-weight:bold; color:var(--accent); font-size:16px;}
#topbar .filestate{font-size:12px; color:var(--muted);}
#topbar .spacer{flex:1;}
.btn{border:1px solid var(--line); background:var(--panel); padding:5px 12px; border-radius:5px; cursor:pointer; font-size:13px;}
.btn:hover{background:var(--accent-soft); border-color:var(--accent);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.primary:hover{opacity:.9;}
.btn.small{padding:2px 8px; font-size:12px;}
/* ===== 主体三栏 ===== */
#main{flex:1; display:flex; min-height:0;}
.col{overflow-y:auto; border-right:1px solid var(--line); background:var(--panel);}
.col1{width:230px; display:flex; flex-direction:column;}
.col2{width:240px;}
.col3{flex:1; display:flex; flex-direction:column; background:var(--bg);}
/* 左栏：笔记本+分区 */
.sect-head{padding:8px 12px 4px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.sect-head .add{cursor:pointer; color:var(--accent); font-size:15px; padding:0 4px;}
#nbList .item,#secList .item,#pgList .item{padding:6px 12px; font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:6px;}
#nbList .item:hover,#secList .item:hover,#pgList .item:hover{background:var(--accent-soft);}
#nbList .item.sel,#secList .item.sel,#pgList .item.sel{background:var(--accent-soft); color:var(--accent); font-weight:bold; border-left:3px solid var(--accent); padding-left:9px;}
.item .del{visibility:hidden; color:#bbb; font-size:12px;}
.item:hover .del{visibility:visible;}
.item .del:hover{color:var(--danger);}
#secList{flex:1; border-top:1px solid var(--line);}
/* ===== 左栏树形层级：笔记本(父) → 缩进分区(子) ===== */
#secHead{padding-left:26px;}                       /* 分区标题区随子级缩进 */
#nbList .item,#secList .item{padding:6px 12px;}
#secList .item{padding-left:34px; font-size:13px;}  /* 分区缩进 22px 表达从属 */
#secList .item .tree-mark{color:var(--muted); margin-right:6px; font-size:11px;}
#secList .item.sel{padding-left:31px;}
/* 页列表 */
#pgSearch{margin:8px 10px; width:calc(100% - 20px); padding:5px 9px; border:1px solid var(--line); border-radius:5px; font-size:13px;}
.col2{display:flex; flex-direction:column;}
#pgList{flex:1; overflow-y:auto;}
/* 编辑区 */
#editorWrap{flex:1; display:flex; flex-direction:column; min-height:0; padding:0 30px 40px; overflow-y:auto;}
#pgTitle{border:none; outline:none; font-size:24px; font-weight:bold; padding:18px 0 8px; background:transparent; color:var(--fg);}
#editor{flex:1; min-height:300px; outline:none; font-size:15px; line-height:1.7; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
#editor:focus{border-color:var(--accent);}
#editor img{max-width:100%;}
#editor blockquote{border-left:3px solid var(--accent); padding-left:12px; color:var(--muted); margin:6px 0;}
#editor h1{font-size:20px; margin:10px 0 4px;} #editor h2{font-size:17px; margin:8px 0 4px;}
#toolbar{display:flex; gap:4px; padding:8px 0; flex-wrap:wrap;}
#toolbar .btn{padding:3px 10px; font-size:12.5px;}
/* 空状态 */
#emptyState{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; color:var(--muted); padding:40px;}
#emptyState h2{color:var(--fg); font-size:18px;}
/* 状态栏 */
#statusbar{display:flex; gap:16px; padding:4px 14px; font-size:12px; color:var(--muted); background:var(--panel); border-top:1px solid var(--line);}
#statusbar .warn{color:var(--danger);}
/* toast / 草稿横幅 */
#toast{position:fixed; bottom:44px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 18px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99;}
#draftBanner{display:none; padding:8px 14px; background:#fff6dd; border-bottom:1px solid #e8d48a; font-size:13px;}
#draftBanner button{margin-left:8px;}
::selection{background:#bfe0d8;}
</style>
</head>
<body>
<div id="topbar">
  <span class="logo">巢记</span>
  <span class="filestate" id="fileState">未打开文件</span>
  <span class="spacer"></span>
  <button class="btn" id="btnOpen" title="打开已有 .nbk 笔记本文件">📂 打开</button>
  <button class="btn" id="btnNew" title="新建空白笔记本（服务器模式存到数据目录；文件模式 Ctrl+S 时选位置）">➕ 新建</button>
  <button class="btn" id="btnSave" title="Ctrl+S，静默写回原文件">💾 保存</button>
  <button class="btn" id="btnExport" title="导出一份副本备份">导出备份</button>
  <button class="btn" id="btnWord" title="把当前页面导出为 .doc（Word 可直接打开）">📄 导出本页 Word</button>
</div>

<div id="draftBanner">检测到上次会话的未保存草稿 <button class="btn small" id="draftRestore">恢复草稿</button> <button class="btn small" id="draftDiscard">丢弃</button></div>
<div id="handleBanner" style="display:none; padding:8px 14px; background:var(--accent-soft); border-bottom:1px solid var(--line); font-size:13px;"><span id="handleName" style="font-weight:bold;"></span> <button class="btn small" id="handleRestore">一点恢复</button> <button class="btn small" id="handleFileOnly" style="display:none">只要文件</button> <button class="btn small" id="handleForget">忘掉它</button> <span class="add" id="handleClose" title="关闭" style="cursor:pointer; margin-left:10px;">✕</span></div>

<div id="main">
  <div class="col col1">
    <div class="sect-head">笔记本 <span class="add" id="addNb" title="新建笔记本">＋</span></div>
    <div id="nbList"></div>
  <div class="sect-head" id="secHead">分区 <span class="add" id="addSec" title="在当前笔记本新建分区">＋</span></div>
    <div id="secList"></div>
  </div>
  <div class="col col2">
    <div class="sect-head" style="padding:8px 12px 4px;">页面 <span class="add" id="addPg" title="新建页面">＋</span></div>
    <input id="pgSearch" placeholder="🔍 搜索标题与正文…">
    <div id="pgList"></div>
  </div>
  <div class="col col3">
    <div id="emptyState">
      <h2>巢记 · 免安装笔记本</h2>
      <p>数据保存在你自己的 <b>.nbk</b> 文件里，每次改动静默写回，不依赖浏览器缓存。</p>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="btnOpenOrNew">📂 打开已有笔记本</button>
        <button class="btn primary" id="btnNewBlank">➕ 新建笔记本</button>
      </div>
    </div>
    <div id="editorWrap" style="display:none;">
      <div style="display:flex; align-items:baseline; gap:12px;">
        <input id="pgTitle" placeholder="页面标题">
        <span id="saveChip" style="font-size:11px; color:var(--muted); white-space:nowrap;"></span>
      </div>
      <div id="toolbar">
        <button class="btn" data-cmd="bold"><b>B</b></button>
        <button class="btn" data-cmd="italic"><i>I</i></button>
        <button class="btn" data-cmd="underline"><u>U</u></button>
        <button class="btn" data-cmd="strikeThrough"><s>S</s></button>
        <button class="btn" data-cmd="formatBlock:h1">H1</button>
        <button class="btn" data-cmd="formatBlock:h2">H2</button>
        <button class="btn" data-cmd="formatBlock:p">正文</button>
        <button class="btn" data-cmd="insertUnorderedList">• 列表</button>
        <button class="btn" data-cmd="insertOrderedList">1. 列表</button>
        <button class="btn" data-cmd="formatBlock:blockquote">引用</button>
        <button class="btn" data-cmd="hiliteColor" title="高亮">🖍</button>
        <button class="btn" id="btnImg" title="插入图片">🖼 图片</button>
      </div>
      <div id="editor" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="stSave">尚未打开文件</span>
  <span id="stDirty"></span>
  <span id="stCount"></span>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".nbk,application/json" style="display:none">

<script>
"use strict";
/* ================= 数据模型 =================
state = {app:"chaoji", ver:1, notebooks:[{id,name,sections:[{id,name,pages:[{id,title,html,created,updated}]}]}]}
*/
const APP = "chaoji";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = id => document.getElementById(id);

let state = null;
let sel = { nb: null, sec: null, pg: null };
let dirty = false;          // 有未写回的改动
let fileHandle = null;      // FileSystemFileHandle（授权后静默写回）
let lastSavedAt = null;
let serverMode = false;     // 服务器模式：保存走 POST /api/save
let serverFile = null;      // 服务器模式当前文件名

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.opacity = 1;
  el.style.pointerEvents = "none";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; }, 2500);
}
/* 带「撤销」的提示（删除后悔药） */
function toastUndo(msg, onUndo) {
  const el = $("toast");
  el.innerHTML = "";
  el.style.opacity = 1;
  el.style.pointerEvents = "auto";
  const span = document.createElement("span");
  span.textContent = msg + " ";
  const btn = document.createElement("button");
  btn.textContent = "撤销";
  btn.style.cssText = "margin-left:10px; padding:2px 10px; cursor:pointer; border:1px solid #888; background:#fff; color:#222; border-radius:4px; font-size:12px;";
  btn.onclick = () => {
    el.style.opacity = 0; el.style.pointerEvents = "none";
    clearTimeout(toastTimer);
    onUndo();
  };
  el.appendChild(span); el.appendChild(btn);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.opacity = 0;
    el.style.pointerEvents = "none";
  }, 6000);
}
function relTime(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return new Date(ts).toLocaleDateString("zh-CN");
}

/* ---------- IndexedDB：会话衔接 + 草稿镜像（非持久层，.nbk 才是真相源） ----------
   keys: "session" -> {fileHandle, fileName, serverFile, lastSavedAt, dirty}
         "draft"   -> {state, savedAt, dirty}  |  兼容旧版纯 JSON 字符串 */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(APP, 1);
    r.onupgradeneeded = e => { e.target.result.createObjectStore("kv"); };
    r.onsuccess = e => res(e.target.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(val, key);
  } catch (e) { /* 静默：镜像失败不影响主流程 */ }
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return new Promise(res => {
      const tx = db.transaction("kv", "readonly");
      const q = tx.objectStore("kv").get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function idbDel(key) {
  try {
    const db = await idbOpen();
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(key);
  } catch (e) { /* ignore */ }
}
/* 兼容旧草稿：JSON 字符串 / {state,savedAt} / 裸 state 对象 */
function normalizeDraft(raw) {
  if (!raw) return null;
  if (typeof raw === "string") {
    try { return { state: JSON.parse(raw), savedAt: 0, dirty: true }; }
    catch (e) { return null; }
  }
  if (raw.state) return { state: raw.state, savedAt: raw.savedAt || 0, dirty: raw.dirty !== false };
  if (raw.app === APP) return { state: raw, savedAt: 0, dirty: true };
  return null;
}
/* 写回会话元数据（句柄可 structured-clone 进 IDB；失败不影响编辑） */
async function persistSession() {
  await idbSet("session", {
    fileHandle: fileHandle || null,
    fileName: fileHandle ? fileHandle.name : null,
    serverFile: serverMode ? serverFile : null,
    lastSavedAt: lastSavedAt ? lastSavedAt.getTime() : null,
    dirty: !!dirty
  });
}
/* 草稿镜像 + 会话 dirty 标记：防抖写，避免每键整本序列化 */
let snapTimer = null;
function scheduleSnapshot() {
  if (snapTimer) clearTimeout(snapTimer);
  snapTimer = setTimeout(async () => {
    snapTimer = null;
    if (!state) return;
    await idbSet("draft", { state, savedAt: Date.now(), dirty: !!dirty });
    await persistSession();
  }, 600);
}

/* ---------- 保存：主=静默写回句柄/服务器API；备=下载 ---------- */
async function saveToHandle(silent) {
  if (!fileHandle) return false;
  try {
    if (fileHandle.queryPermission && (await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
      if ((await fileHandle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("permission denied");
    }
    const w = await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(state)], { type: "application/json" }));
    await w.close();
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    persistSession();
    if (!silent) toast("✓ 已写回 " + fileHandle.name);
    return true;
  } catch (e) {
    if (!silent) toast("⚠ 写回失败：" + e.message + "，已改用下载备份");
    exportDownload();
    return false;
  }
}
/* 服务器模式保存：走 URL 路径协议 POST /api/save/<file>，body 即 state JSON
   （服务器 v2 无 json 依赖，把 JSON 解析留给浏览器） */
async function saveToServer(silent) {
  if (!serverMode || !serverFile) return false;
  try {
    const r = await fetch("/api/save/" + encodeURIComponent(serverFile), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "unknown");
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    persistSession();
    if (!silent) toast("✓ 已保存 " + serverFile);
    return true;
  } catch (e) {
    if (!silent) toast("⚠ 服务器保存失败：" + e.message);
    return false;
  }
}
const saveActive = silent => serverMode ? saveToServer(silent) : saveToHandle(silent);
function exportDownload() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: "application/json" }));
  a.download = (currentNbName() || "chaoji") + "-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "") + ".nbk";
  a.click();
  URL.revokeObjectURL(a.href);
  // 导出备份 ≠ 写回原文件：不得清除 dirty，否则关页不再拦截
  toast("✓ 已导出备份 " + a.download + (dirty ? "（原文件仍有未写回改动）" : ""));
  updateStatus();
}
const currentNbName = () => {
  const nb = state && state.notebooks.find(n => n.id === sel.nb);
  return nb ? nb.name : null;
};

/* ---------- 打开文件 ---------- */
async function openFile() {
  if (serverMode) return serverPickFile();
  if (!window.showOpenFilePicker) return legacyOpen();
  try {
    const [h] = await showOpenFilePicker({
      types: [{ description: "巢记笔记本", accept: { "application/json": [".nbk"] } }]
    });
    fileHandle = h;
    const file = await h.getFile();
    const text = await file.text();
    adoptState(JSON.parse(text), h.name);
    dirty = false; lastSavedAt = new Date();
    persistSession();
  } catch (e) {
    if (e.name !== "AbortError") toast("打开失败：" + e.message);
  }
}
/* 服务器模式：列表弹层选择/新建 .nbk（替代 prompt 序号） */
function pickNbkModal(items) {
  return new Promise(resolve => {
    const mask = document.createElement("div");
    mask.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:300; display:flex; align-items:center; justify-content:center;";
    const box = document.createElement("div");
    box.style.cssText = "background:#fff; border-radius:8px; width:min(420px, 92vw); max-height:70vh; display:flex; flex-direction:column; box-shadow:0 8px 28px rgba(0,0,0,.2);";
    const head = document.createElement("div");
    head.style.cssText = "padding:12px 16px; font-weight:bold; border-bottom:1px solid var(--line);";
    head.textContent = items.length ? "打开数据目录中的笔记本" : "数据目录还没有 .nbk，可新建一个";
    const list = document.createElement("div");
    list.style.cssText = "overflow:auto; flex:1; padding:6px 0;";
    if (!items.length) {
      const tip = document.createElement("div");
      tip.style.cssText = "padding:8px 16px; color:var(--muted); font-size:13px;";
      tip.textContent = "输入文件名新建笔记本（自动补 .nbk）";
      list.appendChild(tip);
    }
    items.forEach(it => {
      const row = document.createElement("div");
      row.style.cssText = "padding:10px 16px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-size:13.5px;";
      row.innerHTML = "<span></span><span style='color:var(--muted); font-size:12px; white-space:nowrap;'></span>";
      row.children[0].textContent = it.file;
      row.children[1].textContent = (it.mtime || "") + (it.size ? " · " + Math.max(1, Math.round(it.size / 1024)) + "KB" : "");
      row.onmouseenter = () => row.style.background = "var(--accent-soft)";
      row.onmouseleave = () => row.style.background = "";
      row.onclick = () => { close(); resolve({ type: "open", file: it.file }); };
      list.appendChild(row);
    });
    const foot = document.createElement("div");
    foot.style.cssText = "padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px;";
    const inp = document.createElement("input");
    inp.placeholder = "新笔记本文件名，如 我的笔记本.nbk";
    inp.style.cssText = "flex:1; padding:6px 10px; border:1px solid var(--line); border-radius:5px; font-size:13px;";
    const btnOk = document.createElement("button");
    btnOk.className = "btn primary"; btnOk.textContent = "新建并打开";
    const btnCancel = document.createElement("button");
    btnCancel.className = "btn"; btnCancel.textContent = "取消";
    btnOk.onclick = () => {
      let name = (inp.value || "").trim();
      if (!name) { inp.focus(); return; }
      if (!name.endsWith(".nbk")) name += ".nbk";
      close(); resolve({ type: "create", file: name });
    };
    btnCancel.onclick = () => { close(); resolve(null); };
    foot.appendChild(inp); foot.appendChild(btnOk); foot.appendChild(btnCancel);
    box.appendChild(head); box.appendChild(list); box.appendChild(foot);
    mask.appendChild(box);
    function close() { mask.remove(); }
    mask.onclick = e => { if (e.target === mask) { close(); resolve(null); } };
    document.body.appendChild(mask);
    inp.focus();
    inp.onkeydown = e => { if (e.key === "Enter") btnOk.click(); if (e.key === "Escape") btnCancel.click(); };
  });
}
async function serverPickFile() {
  try {
    const r = await fetch("/api/list");
    const j = await r.json();
    const items = (j.ok && j.items) || [];
    const pick = await pickNbkModal(items);
    if (!pick) return;
    return serverLoadFile(pick.file);
  } catch (e) { toast("服务器列表失败：" + e.message); }
}
/* 「新建」通用流程：服务器模式直接在数据目录创建并打开；文件模式先建内存，首次 Ctrl+S 落盘 */
async function createNotebookFlow() {
  const name = prompt("新笔记本名称：", "我的笔记本");
  if (name === null) return;
  initBlank();
  state.notebooks.push(newNb(name.trim() || "我的笔记本"));
  sel = { nb: state.notebooks[0].id, sec: state.notebooks[0].sections[0].id, pg: null };
  markDirty();
  renderAll();
  if (serverMode) {
    const fName = (name.trim() || "我的笔记本").replace(/[\\/:*?"<>|]/g, "_") + ".nbk";
    try {
      const r = await fetch("/api/save/" + encodeURIComponent(fName), {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state)
      });
      const j = await r.json();
      if (j.ok) {
        serverFile = fName;
        $("fileState").textContent = fName + "（服务器模式）";
        dirty = false; lastSavedAt = new Date();
        updateStatus();
        persistSession();
        toast("✓ 已创建 " + fName);
      } else {

async function serverLoadFile(name) {

        const fresh = { app: APP, ver: 1, notebooks: [newNb("我的笔记本")] };

/* ---------- 当前页导出 Word (.doc, Word/WPS 直接打开) ----------
   MHTML 思路简化为 word 2000 html 格式：word 原生识别 mso 样式的 html，
   图片用 data URI 内嵌（Word 2016+/WPS均可打开），文件扩展名 .doc */
function exportPageWord(p) {
  const sec = findSec(sel.nb, sel.sec);
  const nb = findNb(sel.nb);
  const title = (p.title || "无标题").replace(/[\\/:*?"<>|]/g, "_");
  const html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
    "xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>" +
    "<head><meta charset='utf-8'><title>" + escHtml(title) + "</title>" +
    "<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->" +
    "<style>" +
    "body{font-family:'Microsoft YaHei',sans-serif; font-size:12pt; line-height:1.6;}" +
    "h1{font-size:18pt;} h2{font-size:15pt;}" +
    "blockquote{border-left:3pt solid #0f6f5c; padding-left:10pt; color:#555; margin:6pt 0;}" +
    "img{max-width:16cm; height:auto;}" +
    "table{border-collapse:collapse;} td,th{border:0.5pt solid #888; padding:3pt 6pt;}" +
    "@page{margin:2cm;}" +
    "</style></head><body>" +
    "<p style='color:#888; font-size:9pt;'>" + escHtml((nb ? nb.name : "") + " / " + (sec ? sec.name : "") + " · 导出于 " +
      new Date().toLocaleString("zh-CN")) + "</p><hr>" +
    "<h1>" + escHtml(p.title || "无标题") + "</h1>" +
    sanitizeForWord(p.html) +
    "</body></html>";
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = title + ".doc";
  a.click();
  URL.revokeObjectURL(a.href);

}
/* Word 专用净化：去掉交互残留（图片缩放角柄 style 由外层 overlay 不在 innerHTML 里，无需处理），保留内联样式 */
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function sanitizeForWord(html) {
  // 去脚本/事件属性，保留 img 的 data URI
  const d = document.createElement("div");
  d.innerHTML = html || "";
  d.querySelectorAll("script,style,iframe,object,embed").forEach(n => n.remove());
  d.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => { if (a.name.startsWith("on")) n.removeAttribute(a.name); });
    if (n.tagName === "IMG") {
      const w = n.style.width;
      if (w) n.setAttribute("width", parseInt(w, 10) || "");
      n.style.width && n.removeAttribute("style") ; // Word 对 style 里的尺寸支持有限，转 width 属性
    }
  });
  return d.innerHTML;
}

/* ---------- Tab 缩进：无选区→两空格；Shift+Tab→outdent；有选区→indent ---------- */
$("editor").addEventListener("keydown", e => {

  e.preventDefault(); e.stopPropagation();
  const selEd = window.getSelection();
  if (e.shiftKey && !selEd.isCollapsed) {
    document.execCommand("outdent", false, null);
  } else if (e.shiftKey) {
    document.execCommand("outdent", false, null);
  } else if (selEd.isCollapsed) {
    document.execCommand("insertText", false, "  ");
  } else {
    document.execCommand("indent", false, null);
  }

/* ---------- 图片尺寸调整：点击图片出现角柄，拖拽缩放 ---------- */
(function setupImageResize() {
  let activeImg = null, overlay = null, startX = 0, startY = 0, startW = 0, startH = 0, aspect = 1, resizing = false;
  const ed = $("editor");
  function showHandles(img) {
    removeHandles();
    const wrap = img.parentElement; if (!wrap) return;
    const r = img.getBoundingClientRect();
    const er = ed.getBoundingClientRect();
    const box = document.createElement("div");
    box.style.cssText = "position:fixed; border:1px solid var(--accent); pointer-events:none; z-index:50;" +
      "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;";
    const h = document.createElement("div");
    h.style.cssText = "position:absolute; right:-5px; bottom:-5px; width:10px; height:10px; background:var(--accent); border-radius:2px; cursor:nwse-resize; pointer-events:auto;";
    h.addEventListener("mousedown", ev => {
      ev.preventDefault(); ev.stopPropagation();
      resizing = true; startX = ev.screenX; startY = ev.screenY; startW = img.width; startH = img.height; aspect = img.height / img.width;
    });

  document.addEventListener("mousemove", e => {
    if (!resizing || !activeImg) return;
    const dx = e.screenX - startX;
    const w = Math.max(60, startW + dx);
    activeImg.style.width = w + "px";
    activeImg.style.height = (w * aspect) + "px";
    showHandles(activeImg);
  });
  document.addEventListener("mouseup", () => {
    if (resizing) {
      resizing = false;
      const p = findPage();
      if (p && p.html !== $("editor").innerHTML) { p.html = $("editor").innerHTML; markDirty(); }
    }

  $("saveChip").textContent = chip;
  if (serverMode) {
    $("stSave").textContent = "服务器模式：" + (serverFile || "未选择笔记本") + (lastSavedAt ? " · 上次保存 " + lastSavedAt.toTimeString().slice(0, 5) : "");
  } else {
    $("stSave").textContent = fileHandle
      ? "文件：" + fileHandle.name + (lastSavedAt ? " · 上次保存 " + lastSavedAt.toTimeString().slice(0, 5) : "")
      : ($("fileState").textContent !== "未打开文件" ? "文件：" + $("fileState").textContent + "（无写回句柄，请用导出备份）" : "尚未打开文件");
  }
  $("stDirty").textContent = dirty ? "● 有未写回改动" : "";
  $("stDirty").className = dirty ? "warn" : "";
  let cnt = 0;
  if (state) state.notebooks.forEach(nb => nb.sections.forEach(s => cnt += s.pages.length));
  $("stCount").textContent = state ? `笔记本 ${state.notebooks.length} · 页面 ${cnt}` : "";
}

/* ---------- 编辑 ---------- */
$("pgTitle").addEventListener("input", () => {
  const p = findPage(); if (!p) return;
  p.title = $("pgTitle").value; p.updated = Date.now(); markDirty();
});
$("editor").addEventListener("input", () => {
  const p = findPage(); if (!p) return;
  p.html = $("editor").innerHTML; p.updated = Date.now(); markDirty();
});
function markDirty() {
  dirty = true; updateStatus();
  scheduleSnapshot();               // 草稿镜像防抖
  scheduleSave();                   // 自动写回防抖
}
/* 输入防抖：停手约 1s 后写回；另有 30s 兜底定时器 */
let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    if (dirty && (fileHandle || (serverMode && serverFile))) await saveActive(true);
  }, 1000);
}

/* toolbar 命令 */
document.querySelectorAll("#toolbar [data-cmd]").forEach(b => {
  b.onclick = () => {
    const cmd = b.dataset.cmd;
    $("editor").focus();
    if (cmd === "hiliteColor") document.execCommand("styleWithCSS", false, true), document.execCommand("hiliteColor", false, "#fff3a3");
    else if (cmd.startsWith("formatBlock:")) document.execCommand("formatBlock", false, cmd.split(":")[1]);
    else document.execCommand(cmd, false, null);
    const p = findPage();
    if (p) { p.html = $("editor").innerHTML; markDirty(); }
  };
});
$("btnImg").onclick = () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const dataUrl = await compressImage(f);
    document.execCommand("insertHTML", false, "<img src='" + dataUrl + "'>");
    const p = findPage();
    if (p) { p.html = $("editor").innerHTML; markDirty(); }
  };
  inp.click();
};
function compressImage(file) {
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const MAX = 1280;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = () => { // 压缩失败退回原始读法
      URL.revokeObjectURL(url);
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
    };
    img.src = url;
  });
}
/* 粘贴图片 */
$("editor").addEventListener("paste", async e => {
  const items = [...(e.clipboardData || {}).items || []];
  const imgItem = items.find(i => i.type.startsWith("image/"));
  if (!imgItem) return;
  e.preventDefault();
  const blob = imgItem.getAsFile();
  const dataUrl = await compressImage(blob);
  document.execCommand("insertHTML", false, "<img src='" + dataUrl + "'>");
  const p = findPage();
  if (p) { p.html = $("editor").innerHTML; markDirty(); }
});

/* 搜索 */
$("pgSearch").addEventListener("input", renderPages);
$("pgSearch").addEventListener("keydown", e => { if (e.key === "Enter") { const first = $("pgList").querySelector(".item"); if (first) first.click(); } });
/* 页面栏 ＋ 新建（不再需要先退出当前页） */
$("addPg").onclick = addPage;
/* 横幅关闭 */
$("handleClose").onclick = () => { $("handleBanner").style.display = "none"; };

/* Ctrl+S / Ctrl+N / Ctrl+Shift+S(导出) */
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "s") {
    e.preventDefault();
    if (state) {
      if (serverMode) saveActive(false);
      else ensureFileThen(() => saveActive(false));
    }
  }
  if ((e.ctrlKey || e.metaKey) && k === "n") {
    e.preventDefault();
    addPage();
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === "s") {
    e.preventDefault();
    if (state) exportDownload();
  }
});

/* 关闭前拦截未保存改动 */
window.addEventListener("beforeunload", e => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

/* 30 秒兜底自动保存（防抖之外的保险丝） */
setInterval(async () => {
  if (dirty && (fileHandle || (serverMode && serverFile))) await saveActive(true);
}, 30000);

/* ---------- 启动：服务器探测 → 会话/句柄恢复 → 草稿衔接 ----------
   横幅约定：任一时刻最多一条恢复横幅（句柄优先，草稿仅在无句柄时独立出现） */
function hideRecoverBanners() {
  $("handleBanner").style.display = "none";
  $("draftBanner").style.display = "none";
}
function draftIsNewer(sess, draftRaw) {
  const d = normalizeDraft(draftRaw);
  return !!(d && d.state && d.state.app === APP && d.dirty && (d.savedAt || 0) > ((sess && sess.lastSavedAt) || 0));
}
/* applyDraft=true 时把未写回草稿一并套用（用户点「一点恢复」默认要最新内容） */
async function restoreFromSession(sess, draftRaw, applyDraft) {
  const h = sess && sess.fileHandle;
  if (!h) return false;
  try {
    if (h.queryPermission) {
      const p = await h.queryPermission({ mode: "readwrite" });
      if (p !== "granted") {
        if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") {
          toast("未授权访问该文件，请再点「一点恢复」或手动打开");
          return false;
        }
      }
    }
    fileHandle = h;
    const text = await (await h.getFile()).text();
    const obj = JSON.parse(text);
    if (!obj || obj.app !== APP) {
      fileHandle = null;
      toast("文件不是有效的巢记笔记本");
      return false;
    }
    const d = normalizeDraft(draftRaw);
    const useDraft = applyDraft && draftIsNewer(sess, draftRaw);
    adoptState(useDraft ? d.state : obj, h.name + (useDraft ? "（含未写回改动）" : ""));
    fileHandle = h;
    lastSavedAt = sess.lastSavedAt ? new Date(sess.lastSavedAt) : null;
    dirty = useDraft ? true : !!sess.dirty;
    hideRecoverBanners();
    updateStatus();
    persistSession();
    scheduleSnapshot();
    if (dirty) scheduleSave();
    return true;
  } catch (e) {
    fileHandle = null;
    toast("恢复上次笔记本失败：" + e.message + "，可手动打开 .nbk");
    return false;
  }
}

(async () => {
  // 1) 探测服务器模式
  try {
    const r = await fetch("/api/ping", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j.ok && j.mode === "server") {
        serverMode = true;
        $("fileState").textContent = "服务器模式 · 数据目录 " + j.dataDir;
        updateStatus();
        const sess = await idbGet("session");
        if (sess && sess.serverFile) {
          await serverLoadFile(sess.serverFile);   // 刷新后续写同一 .nbk
        } else {
          $("handleBanner").style.display = "block";
          $("handleName").textContent = "服务器模式：选择或新建 .nbk";
          $("handleRestore").textContent = "📂 选择笔记本";
          $("handleRestore").onclick = () => serverPickFile();
          $("handleFileOnly").style.display = "none";
          $("handleForget").style.display = "none";
        }
        return;
      }
    }
  } catch (e) { /* 非 http 或服务未起，走文件模式 */ }

  // 2) 文件模式：句柄与草稿合并为一条横幅，绝不叠两条
  const sess = await idbGet("session");
  const draftRaw = await idbGet("draft");
  const newerDraft = draftIsNewer(sess, draftRaw);

  if (sess && sess.fileHandle) {
    let perm = "unknown";
    try {
      if (sess.fileHandle.queryPermission) {
        perm = await sess.fileHandle.queryPermission({ mode: "readwrite" });
      }
    } catch (e) { perm = "unknown"; }

    if (perm === "granted") {
      // 已授权：直接续上；若有更新草稿则默认套用（用户刷新前多半在改这份）
      const ok = await restoreFromSession(sess, draftRaw, newerDraft);
      if (ok) return;
    }
    // 需用户手势授权 → 单条横幅承载全部恢复选项
    $("draftBanner").style.display = "none";
    $("handleBanner").style.display = "block";
    const name = sess.fileName || sess.fileHandle.name || "上次笔记本";
    $("handleName").textContent = "检测到上次打开的笔记本：" + name + (newerDraft ? "（含未写回改动）" : "");
    $("handleRestore").textContent = newerDraft ? "一点恢复（含未写回）" : "一点恢复（免选文件）";
    $("handleRestore").onclick = async () => {
      const ok = await restoreFromSession(sess, draftRaw, true);
      if (ok) toast("✓ 已恢复 " + name + (newerDraft ? "（含未写回改动）" : ""));
    };
    if (newerDraft) {
      $("handleFileOnly").style.display = "";
      $("handleFileOnly").onclick = async () => {
        const ok = await restoreFromSession(sess, draftRaw, false);
        if (ok) {
          idbSet("draft", { state, savedAt: Date.now(), dirty: false });
          toast("✓ 已恢复 " + name + "（丢弃未写回改动）");
        }
      };
    } else {
      $("handleFileOnly").style.display = "none";
    }
    $("handleForget").style.display = "";
    $("handleForget").onclick = async () => {
      await idbDel("session");
      if (newerDraft) await idbSet("draft", { app: "empty", savedAt: Date.now() });
      hideRecoverBanners();
      toast("已忘掉上次文件" + (newerDraft ? "与未写回草稿" : "") + "，请手动打开 .nbk");
    };
    return;   // 有句柄就不再走独立草稿横幅
  }

  // 3) 仅草稿（无句柄）：这才单独出草稿横幅
  const d = normalizeDraft(draftRaw);
  if (d && d.state && d.state.app === APP && state === null) {
    $("handleBanner").style.display = "none";
    $("draftBanner").style.display = "block";
    $("draftRestore").onclick = () => {
      adoptState(d.state, "上次草稿（未关联文件）");
      dirty = true;
      updateStatus();
      scheduleSnapshot();
      scheduleSave();
      $("draftBanner").style.display = "none";
    };
    $("draftDiscard").onclick = () => {
      $("draftBanner").style.display = "none";
      idbSet("draft", { app: "empty", savedAt: Date.now() });
    };
  }
})();
function initBlank() {
  state = { app: APP, ver: 1, notebooks: [] };   // 空壳，不塞默认笔记本（由调用方决定建什么）
  renderAll();
}
</script>
