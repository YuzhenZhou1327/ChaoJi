<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>巢记 · 免安装笔记本</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --line:#e0e0dc; --fg:#2b2b28; --muted:#8a8a84;
  --accent:#0f6f5c; --accent-soft:#e3f0ed; --danger:#b3402f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; overflow:hidden;}
button{font-family:inherit;}
/* ===== 顶栏 ===== */
#topbar{display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);}
#topbar .logo{font-weight:bold; color:var(--accent); font-size:16px;}
#topbar .filestate{font-size:12px; color:var(--muted);}
#topbar .spacer{flex:1;}
.btn{border:1px solid var(--line); background:var(--panel); padding:5px 12px; border-radius:5px; cursor:pointer; font-size:13px;}
.btn:hover{background:var(--accent-soft); border-color:var(--accent);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.primary:hover{opacity:.9;}
.btn.small{padding:2px 8px; font-size:12px;}
/* ===== 主体三栏 ===== */
#main{flex:1; display:flex; min-height:0;}
.col{overflow-y:auto; border-right:1px solid var(--line); background:var(--panel);}
.col1{width:230px; display:flex; flex-direction:column;}
.col2{width:240px;}
.col3{flex:1; display:flex; flex-direction:column; background:var(--bg);}
/* 左栏：笔记本+分区 */
.sect-head{padding:8px 12px 4px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
.sect-head .add{cursor:pointer; color:var(--accent); font-size:15px; padding:0 4px;}
#nbList .item,#secList .item,#pgList .item{padding:6px 12px; font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:6px;}
#nbList .item:hover,#secList .item:hover,#pgList .item:hover{background:var(--accent-soft);}
#nbList .item.sel,#secList .item.sel,#pgList .item.sel{background:var(--accent-soft); color:var(--accent); font-weight:bold; border-left:3px solid var(--accent); padding-left:9px;}
.item .del{visibility:hidden; color:#bbb; font-size:12px;}
.item:hover .del{visibility:visible;}
.item .del:hover{color:var(--danger);}
#secList{flex:1; border-top:1px solid var(--line);}
/* ===== 左栏树形层级：笔记本(父) → 缩进分区(子) ===== */
#secHead{padding-left:26px;}                       /* 分区标题区随子级缩进 */
#nbList .item,#secList .item{padding:6px 12px;}
#secList .item{padding-left:34px; font-size:13px;}  /* 分区缩进 22px 表达从属 */
#secList .item .tree-mark{color:var(--muted); margin-right:6px; font-size:11px;}
#secList .item.sel{padding-left:31px;}
/* 页列表 */
#pgSearch{margin:8px 10px; width:calc(100% - 20px); padding:5px 9px; border:1px solid var(--line); border-radius:5px; font-size:13px;}
.col2{display:flex; flex-direction:column;}
#pgList{flex:1; overflow-y:auto;}
/* 编辑区 */
#editorWrap{flex:1; display:flex; flex-direction:column; min-height:0; padding:0 30px 40px; overflow-y:auto;}
#pgTitle{border:none; outline:none; font-size:24px; font-weight:bold; padding:18px 0 8px; background:transparent; color:var(--fg);}
#editor{flex:1; min-height:300px; outline:none; font-size:15px; line-height:1.7; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
#editor:focus{border-color:var(--accent);}
#editor img{max-width:100%;}
#editor blockquote{border-left:3px solid var(--accent); padding-left:12px; color:var(--muted); margin:6px 0;}
#editor h1{font-size:20px; margin:10px 0 4px;} #editor h2{font-size:17px; margin:8px 0 4px;}
#toolbar{display:flex; gap:4px; padding:8px 0; flex-wrap:wrap;}
#toolbar .btn{padding:3px 10px; font-size:12.5px;}
/* 空状态 */
#emptyState{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; color:var(--muted); padding:40px;}
#emptyState h2{color:var(--fg); font-size:18px;}
/* 状态栏 */
#statusbar{display:flex; gap:16px; padding:4px 14px; font-size:12px; color:var(--muted); background:var(--panel); border-top:1px solid var(--line);}
#statusbar .warn{color:var(--danger);}
/* toast / 草稿横幅 */
#toast{position:fixed; bottom:44px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 18px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99;}
#draftBanner{display:none; padding:8px 14px; background:#fff6dd; border-bottom:1px solid #e8d48a; font-size:13px;}
#draftBanner button{margin-left:8px;}
::selection{background:#bfe0d8;}
</style>
</head>
<body>
<div id="topbar">
  <span class="logo">巢记</span>
  <span class="filestate" id="fileState">未打开文件</span>
  <span class="spacer"></span>
  <button class="btn" id="btnOpen" title="打开已有 .nbk 笔记本文件">📂 打开</button>
  <button class="btn" id="btnNew" title="新建空白笔记本（服务器模式存到数据目录；文件模式 Ctrl+S 时选位置）">➕ 新建</button>
  <button class="btn" id="btnSave" title="Ctrl+S，静默写回原文件">💾 保存</button>
  <button class="btn" id="btnExport" title="导出一份副本备份">导出备份</button>
  <button class="btn" id="btnWord" title="把当前页面导出为 .doc（Word 可直接打开）">📄 导出本页 Word</button>
</div>

<div id="draftBanner">检测到上次会话的未保存草稿 <button class="btn small" id="draftRestore">恢复草稿</button> <button class="btn small" id="draftDiscard">丢弃</button></div>
<div id="handleBanner" style="display:none; padding:8px 14px; background:var(--accent-soft); border-bottom:1px solid var(--line); font-size:13px;">检测到上次打开的笔记本：<span id="handleName" style="font-weight:bold;"></span> <button class="btn small" id="handleRestore">一点恢复（免选文件）</button> <button class="btn small" id="handleForget">忘掉它，手动选</button> <span class="add" id="handleClose" title="关闭" style="cursor:pointer; margin-left:10px;">✕</span></div>

<div id="main">
  <div class="col col1">
    <div class="sect-head">笔记本 <span class="add" id="addNb" title="新建笔记本">＋</span></div>
    <div id="nbList"></div>
  <div class="sect-head" id="secHead">分区 <span class="add" id="addSec" title="在当前笔记本新建分区">＋</span></div>
    <div id="secList"></div>
  </div>
  <div class="col col2">
    <div class="sect-head" style="padding:8px 12px 4px;">页面 <span class="add" id="addPg" title="新建页面">＋</span></div>
    <input id="pgSearch" placeholder="🔍 搜索标题与正文…">
    <div id="pgList"></div>
  </div>
  <div class="col col3">
    <div id="emptyState">
      <h2>巢记 · 免安装笔记本</h2>
      <p>数据保存在你自己的 <b>.nbk</b> 文件里，每次改动静默写回，不依赖浏览器缓存。</p>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="btnOpenOrNew">📂 打开已有笔记本</button>
        <button class="btn primary" id="btnNewBlank">➕ 新建笔记本</button>
      </div>
    </div>
    <div id="editorWrap" style="display:none;">
      <div style="display:flex; align-items:baseline; gap:12px;">
        <input id="pgTitle" placeholder="页面标题">
        <span id="saveChip" style="font-size:11px; color:var(--muted); white-space:nowrap;"></span>
      </div>
      <div id="toolbar">
        <button class="btn" data-cmd="bold"><b>B</b></button>
        <button class="btn" data-cmd="italic"><i>I</i></button>
        <button class="btn" data-cmd="underline"><u>U</u></button>
        <button class="btn" data-cmd="strikeThrough"><s>S</s></button>
        <button class="btn" data-cmd="formatBlock:h1">H1</button>
        <button class="btn" data-cmd="formatBlock:h2">H2</button>
        <button class="btn" data-cmd="formatBlock:p">正文</button>
        <button class="btn" data-cmd="insertUnorderedList">• 列表</button>
        <button class="btn" data-cmd="insertOrderedList">1. 列表</button>
        <button class="btn" data-cmd="formatBlock:blockquote">引用</button>
        <button class="btn" data-cmd="hiliteColor" title="高亮">🖍</button>
        <button class="btn" id="btnImg" title="插入图片">🖼 图片</button>
      </div>
      <div id="editor" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="stSave">尚未打开文件</span>
  <span id="stDirty"></span>
  <span id="stCount"></span>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".nbk,application/json" style="display:none">

<script>
"use strict";
/* ================= 数据模型 =================
state = {app:"chaoji", ver:1, notebooks:[{id,name,sections:[{id,name,pages:[{id,title,html,created,updated}]}]}]}
*/
const APP = "chaoji";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = id => document.getElementById(id);

let state = null;
let sel = { nb: null, sec: null, pg: null };
let dirty = false;          // 有未写回的改动
let fileHandle = null;      // FileSystemFileHandle（授权后静默写回）
let lastSavedAt = null;
let serverMode = false;     // 服务器模式：保存走 POST /api/save
let serverFile = null;      // 服务器模式当前文件名

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").style.opacity = 0; }, 2500);
}

/* ---------- IndexedDB 镜像（会话内恢复用） ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(APP, 1);
    r.onupgradeneeded = e => { e.target.result.createObjectStore("kv"); };
    r.onsuccess = e => res(e.target.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(val) {
  try {
    const db = await idbOpen();
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(val, "draft");
  } catch (e) { /* 静默：镜像失败不影响主流程 */ }
}
async function idbGet() {
  try {
    const db = await idbOpen();
    return new Promise(res => {
      const tx = db.transaction("kv", "readonly");
      const q = tx.objectStore("kv").get("draft");
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}

/* ---------- 保存：主=静默写回句柄/服务器API；备=下载 ---------- */
async function saveToHandle(silent) {
  if (!fileHandle) return false;
  try {
    if (fileHandle.queryPermission && (await fileHandle.queryPermission({ mode: "readwrite" })) !== "granted") {
      if ((await fileHandle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("permission denied");
    }
    const w = await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(state)], { type: "application/json" }));
    await w.close();
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    if (!silent) toast("✓ 已写回 " + fileHandle.name);
    return true;
  } catch (e) {
    if (!silent) toast("⚠ 写回失败：" + e.message + "，已改用下载备份");
    exportDownload();
    return false;
  }
}
/* 服务器模式保存：走 URL 路径协议 POST /api/save/<file>，body 即 state JSON
   （服务器 v2 无 json 依赖，把 JSON 解析留给浏览器） */
async function saveToServer(silent) {
  if (!serverMode || !serverFile) return false;
  try {
    const r = await fetch("/api/save/" + encodeURIComponent(serverFile), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "unknown");
    dirty = false; lastSavedAt = new Date();
    updateStatus();
    if (!silent) toast("✓ 已保存 " + serverFile);
    return true;
  } catch (e) {
    if (!silent) toast("⚠ 服务器保存失败：" + e.message);
    return false;
  }
}
const saveActive = silent => serverMode ? saveToServer(silent) : saveToHandle(silent);
function exportDownload() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: "application/json" }));
  a.download = (currentNbName() || "chaoji") + "-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "") + ".nbk";
  a.click();
  URL.revokeObjectURL(a.href);
  dirty = false; lastSavedAt = new Date();
  updateStatus();
}
const currentNbName = () => {
  const nb = state && state.notebooks.find(n => n.id === sel.nb);
  return nb ? nb.name : null;
};

/* ---------- 打开文件 ---------- */
async function openFile() {
  if (serverMode) return serverPickFile();
  if (!window.showOpenFilePicker) return legacyOpen();
  try {
    const [h] = await showOpenFilePicker({
      types: [{ description: "巢记笔记本", accept: { "application/json": [".nbk"] } }]
    });
    fileHandle = h;
    const file = await h.getFile();
    const text = await file.text();
    adoptState(JSON.parse(text), h.name);
  } catch (e) {
    if (e.name !== "AbortError") toast("打开失败：" + e.message);
  }
}
/* 服务器模式：列出数据目录 .nbk 供选择 */
async function serverPickFile() {
  try {
    const r = await fetch("/api/list");
    const j = await r.json();
    if (!j.ok || !j.items.length) {
      const name = prompt("数据目录还没有 .nbk 文件。输入新笔记本文件名（如 我的笔记本.nbk）：", "我的笔记本.nbk");
      if (name && name.endsWith(".nbk")) return serverLoadFile(name);
      return;
    }
    const lines = j.items.map((it, i) => (i + 1) + ". " + it.file + "  (" + it.mtime + ")");
    const pick = prompt("数据目录中的笔记本：\n" + lines.join("\n") + "\n\n输入序号打开，或输入新文件名新建：", "1");
    if (pick === null) return;
    const n = parseInt(pick, 10);
    if (!isNaN(n) && n >= 1 && n <= j.items.length) return serverLoadFile(j.items[n - 1].file);
    if (pick && pick.endsWith(".nbk")) return serverLoadFile(pick);
  } catch (e) { toast("服务器列表失败：" + e.message); }
}
/* 「新建」通用流程：服务器模式直接在数据目录创建并打开；文件模式先建内存，首次 Ctrl+S 落盘 */
async function createNotebookFlow() {
  const name = prompt("新笔记本名称：", "我的笔记本");
  if (name === null) return;
  initBlank();
  state.notebooks.push(newNb(name.trim() || "我的笔记本"));
  sel = { nb: state.notebooks[0].id, sec: state.notebooks[0].sections[0].id, pg: null };
  dirty = true;
  renderAll();
  if (serverMode) {
    const fName = (name.trim() || "我的笔记本").replace(/[\\/:*?"<>|]/g, "_") + ".nbk";
    try {
      const r = await fetch("/api/save/" + encodeURIComponent(fName), {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state)
      });
      const j = await r.json();
      if (j.ok) {
        serverFile = fName;
        $("fileState").textContent = fName + "（服务器模式）";
        dirty = false; lastSavedAt = new Date();
        updateStatus();
        toast("✓ 已创建 " + fName);
      } else {
        toast("⚠ 已创建但保存失败：" + (j.error || "") + "，可手动 Ctrl+S");
      }
    } catch (e) { toast("⚠ 保存失败：" + e.message + "，可手动 Ctrl+S"); }
  } else {
    $("fileState").textContent = (name.trim() || "我的笔记本") + "（新笔记本，Ctrl+S 保存到文件）";
  }
}
$("btnNew").onclick = createNotebookFlow;
$("btnNewBlank").onclick = createNotebookFlow;
/* 「打开」按钮：服务器模式走列表选择（openFile 内部分派），文件模式走系统对话框 */
async function serverLoadFile(name) {
  try {
    if (!name.endsWith(".nbk")) name += ".nbk";
    const r = await fetch("/api/load/" + encodeURIComponent(name));
    const j = await r.json();
    if (!j.ok) {
      if (r.status === 404) {  // 新文件：植入默认笔记本+分区并立即落盘（否则重开又 404）
        const fresh = { app: APP, ver: 1, notebooks: [newNb("我的笔记本")] };
        state = fresh;
        sel = { nb: fresh.notebooks[0].id, sec: fresh.notebooks[0].sections[0].id, pg: null };
        serverFile = name;
        $("fileState").textContent = name + "（服务器模式）";
        const sr = await fetch("/api/save/" + encodeURIComponent(name), {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state)
        });
        const sj = await sr.json();
        if (sj.ok) { dirty = false; lastSavedAt = new Date(); toast("✓ 已创建并打开 " + name); }
        else toast("⚠ 笔记本已打开但首次保存失败：" + (sj.error || ""));
        renderAll(); updateStatus();
        return;
      }
      throw new Error(j.error || "unknown");
    }
    serverFile = name;
    adoptState(j.state, name);
    $("fileState").textContent = name + "（服务器模式）";
  } catch (e) { toast("打开失败：" + e.message); }
}
function legacyOpen() {
  $("fileInput").click();
}
$("fileInput").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { adoptState(JSON.parse(await f.text()), f.name); }
  catch (err) { toast("打开失败：" + err.message); }
  e.target.value = "";
});
function adoptState(obj, name) {
  if (!obj || obj.app !== APP || !Array.isArray(obj.notebooks)) {
    toast("这不是有效的巢记笔记本文件"); return;
  }
  state = obj;
  // 空笔记本合法存在（用户可能刚建），不再强制塞默认本；列表为空时仍正常渲染空状态
  sel.nb = state.notebooks[0] ? state.notebooks[0].id : null;
  const nb0 = findNb(sel.nb);
  sel.sec = nb0 && nb0.sections[0] ? nb0.sections[0].id : null;
  sel.pg = null;
  $("fileState").textContent = name;
  renderAll();
  toast("✓ 已打开 " + name);
}

/* ---------- 新建 ---------- */
function newNb(name) { return { id: uid(), name, sections: [{ id: uid(), name: "未命名分区", pages: [] }] }; }
$("btnOpen").onclick = openFile;
$("btnSave").onclick = () => { if (serverMode) { saveActive(false); } else { ensureFileThen(() => saveActive(false)); } };
$("btnExport").onclick = () => { state ? exportDownload() : toast("还没有内容"); };
$("btnWord").onclick = () => {
  const p = findPage();
  if (!p) return toast("请先选中一个页面");
  exportPageWord(p);
};
/* ---------- 当前页导出 Word (.doc, Word/WPS 直接打开) ----------
   MHTML 思路简化为 word 2000 html 格式：word 原生识别 mso 样式的 html，
   图片用 data URI 内嵌（Word 2016+/WPS均可打开），文件扩展名 .doc */
function exportPageWord(p) {
  const sec = findSec(sel.nb, sel.sec);
  const nb = findNb(sel.nb);
  const title = (p.title || "无标题").replace(/[\\/:*?"<>|]/g, "_");
  const html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
    "xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>" +
    "<head><meta charset='utf-8'><title>" + escHtml(title) + "</title>" +
    "<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->" +
    "<style>" +
    "body{font-family:'Microsoft YaHei',sans-serif; font-size:12pt; line-height:1.6;}" +
    "h1{font-size:18pt;} h2{font-size:15pt;}" +
    "blockquote{border-left:3pt solid #0f6f5c; padding-left:10pt; color:#555; margin:6pt 0;}" +
    "img{max-width:16cm; height:auto;}" +
    "table{border-collapse:collapse;} td,th{border:0.5pt solid #888; padding:3pt 6pt;}" +
    "@page{margin:2cm;}" +
    "</style></head><body>" +
    "<p style='color:#888; font-size:9pt;'>" + escHtml((nb ? nb.name : "") + " / " + (sec ? sec.name : "") + " · 导出于 " +
      new Date().toLocaleString("zh-CN")) + "</p><hr>" +
    "<h1>" + escHtml(p.title || "无标题") + "</h1>" +
    sanitizeForWord(p.html) +
    "</body></html>";
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = title + ".doc";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("✓ 已导出 " + a.download);
}
/* Word 专用净化：去掉交互残留（图片缩放角柄 style 由外层 overlay 不在 innerHTML 里，无需处理），保留内联样式 */
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function sanitizeForWord(html) {
  // 去脚本/事件属性，保留 img 的 data URI
  const d = document.createElement("div");
  d.innerHTML = html || "";
  d.querySelectorAll("script,style,iframe,object,embed").forEach(n => n.remove());
  d.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => { if (a.name.startsWith("on")) n.removeAttribute(a.name); });
    if (n.tagName === "IMG") {
      const w = n.style.width;
      if (w) n.setAttribute("width", parseInt(w, 10) || "");
      n.style.width && n.removeAttribute("style") ; // Word 对 style 里的尺寸支持有限，转 width 属性
    }
  });
  return d.innerHTML;
}


// 没有句柄时先引导「另存为」建立 .nbk，再继续保存
async function ensureFileThen(fn) {
  if (fileHandle) return fn();
  try {
    const h = await showSaveFilePicker({
      suggestedName: (currentNbName() || "我的笔记本") + ".nbk",
      types: [{ description: "巢记笔记本", accept: { "application/json": [".nbk"] } }]
    });
    fileHandle = h;
    $("fileState").textContent = h.name;
    return fn();
  } catch (e) { if (e.name !== "AbortError") toast("保存中断：" + e.message); }
}

/* ---------- 结构操作 ---------- */
$("addNb").onclick = () => {
  const name = prompt("笔记本名称：", "新笔记本"); if (name === null) return;
  if (!state) initBlank();               // 只创建空壳 state，不塞默认笔记本
  const nb = newNb(name || "新笔记本");
  state.notebooks.push(nb);
  sel = { nb: nb.id, sec: nb.sections[0].id, pg: null }; dirty = true;
  renderAll();
};
$("addSec").onclick = () => {
  const nb = state && state.notebooks.find(n => n.id === sel.nb);
  if (!nb) return toast("请先选中一个笔记本");
  const name = prompt("分区名称：", "新分区"); if (name === null) return;
  const sec = { id: uid(), name: name || "新分区", pages: [] };
  nb.sections.push(sec);
  sel.sec = sec.id; sel.pg = null; dirty = true;
  renderAll();
};
function renameItem(kind, id) {
  if (kind === "nb") {
    const nb = findNb(id); if (!nb) return;
    const name = prompt("重命名笔记本：", nb.name); if (name === null || !name.trim()) return;
    nb.name = name.trim();
  } else {
    const sec = findSec(sel.nb, id); if (!sec) return;
    const name = prompt("重命名分区：", sec.name); if (name === null || !name.trim()) return;
    sec.name = name.trim();
  }
  dirty = true; renderAll();
}
function delNb(id) {
  if (!confirm("删除整个笔记本及其全部分区/页面？")) return;
  state.notebooks = state.notebooks.filter(n => n.id !== id);
  // 允许删到 0 个：空笔记本是合法状态（可随时从左栏＋重建），不再强制回塞，修复"删不掉"
  if (sel.nb === id) {
    const first = state.notebooks[0];
    sel.nb = first ? first.id : null;
    sel.sec = first && first.sections[0] ? first.sections[0].id : null;
    sel.pg = null;
  }
  dirty = true; renderAll();
}
function delSec(id) {
  const nb = state.notebooks.find(n => n.id === sel.nb);
  if (!confirm("删除分区及其中所有页面？")) return;
  nb.sections = nb.sections.filter(s => s.id !== id);
  if (sel.sec === id) { sel.sec = nb.sections[0] ? nb.sections[0].id : null; sel.pg = null; }
  dirty = true; renderAll();
}
function delPg(id) {
  const sec = findSec(sel.nb, sel.sec);
  if (!confirm("删除本页？")) return;
  sec.pages = sec.pages.filter(p => p.id !== id);
  if (sel.pg === id) sel.pg = null;
  dirty = true; renderAll();
}
const findNb = id => state && state.notebooks.find(n => n.id === id);
const findSec = (nbId, secId) => { const nb = findNb(nbId); return nb ? nb.sections.find(s => s.id === secId) : null; };

/* ---------- 渲染 ---------- */
function renderAll() {
  if (!state) { $("emptyState").style.display = "flex"; $("editorWrap").style.display = "none"; return; }
  $("emptyState").style.display = "none";
  $("editorWrap").style.display = "flex";
  $("draftBanner").style.display = "none";
  renderNbs(); renderSecs(); renderPages(); renderEditor(); updateStatus();
}
function renderNbs() {
  const el = $("nbList"); el.innerHTML = "";
  state.notebooks.forEach(nb => {
    const d = document.createElement("div");
    d.className = "item" + (nb.id === sel.nb ? " sel" : "");
    d.innerHTML = "<span></span><span class='ren' title='重命名'>✎</span><span class='del' title='删除'>✕</span>";
    d.children[0].textContent = "📕 " + nb.name;
    d.onclick = e => { if (e.target.classList.contains("del")) return delNb(nb.id); if (e.target.classList.contains("ren")) return renameItem("nb", nb.id); sel.nb = nb.id; sel.sec = nb.sections[0] ? nb.sections[0].id : null; sel.pg = null; renderAll(); };
    d.oncontextmenu = e => { e.preventDefault(); ctxMenu(e, [["✏ 重命名", () => renameItem("nb", nb.id)], ["🗑 删除", () => delNb(nb.id)], ["➕ 新建分区", () => { sel.nb = nb.id; $("addSec").click(); }], ["➕ 新建页面", () => { sel.nb = nb.id; sel.sec = nb.sections[0] ? nb.sections[0].id : null; addPage(); }]]); };
    el.appendChild(d);
  });
}
function renderSecs() {
  const el = $("secList"); el.innerHTML = "";
  const nb = findNb(sel.nb); const nbName = nb ? nb.name : "";
  $("secHead").childNodes[0].textContent = "└ 分区" + (nbName ? "·" + nbName : "") + " ";
  if (!nb) return;
  nb.sections.forEach(sec => {
    const d = document.createElement("div");
    d.className = "item" + (sec.id === sel.sec ? " sel" : "");
    d.innerHTML = "<span class='tree-mark'>📄</span><span></span><span class='ren' title='重命名'>✎</span><span class='del'>✕</span>";
    d.children[1].textContent = sec.name;
    d.onclick = e => { if (e.target.classList.contains("del")) return delSec(sec.id); if (e.target.classList.contains("ren")) return renameItem("sec", sec.id); sel.sec = sec.id; sel.pg = null; renderAll(); };
    d.oncontextmenu = e => { e.preventDefault(); ctxMenu(e, [["✏ 重命名", () => renameItem("sec", sec.id)], ["🗑 删除", () => delSec(sec.id)], ["➕ 新建页面", () => { sel.sec = sec.id; addPage(); }]]); };
    el.appendChild(d);
  });
}
function renderPages() {
  const el = $("pgList"); el.innerHTML = "";
  const sec = findSec(sel.nb, sel.sec); if (!sec) return;
  const kw = $("pgSearch").value.trim().toLowerCase();
  sec.pages.forEach(p => {
    const hit = !kw || p.title.toLowerCase().includes(kw) || stripTags(p.html).toLowerCase().includes(kw);
    if (!hit) return;
    const d = document.createElement("div");
    d.className = "item" + (p.id === sel.pg ? " sel" : "");
    d.innerHTML = "<span></span><span class='del'>✕</span>";
    d.children[0].textContent = p.title || "（无标题）";
    d.onclick = e => { if (e.target.classList.contains("del")) return delPg(p.id); sel.pg = p.id; renderAll(); };
    d.oncontextmenu = e => { e.preventDefault(); ctxMenu(e, [["🗑 删除", () => delPg(p.id)], ["📋 复制页面", () => copyPage(p)]]); };
    el.appendChild(d);
  });
}
/* 复制页（追加到当前分区末尾） */
function copyPage(p) {
  const sec = findSec(sel.nb, sel.sec); if (!sec) return;
  const np = JSON.parse(JSON.stringify(p));
  np.id = uid(); np.title = (p.title || "无标题") + " (副本)"; np.created = np.updated = Date.now();
  sec.pages.unshift(np); sel.pg = np.id; dirty = true; renderAll();
}

/* ---------- 自定义右键菜单 ---------- */
let ctxEl = null;
function ctxMenu(e, items) {
  closeCtx();
  const m = document.createElement("div");
  m.style.cssText = "position:fixed; z-index:200; background:#fff; border:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.18); border-radius:6px; padding:4px 0; min-width:140px; font-size:13px;";
  items.forEach(([label, fn]) => {
    const it = document.createElement("div");
    if (fn === null) { it.style.cssText = "border-top:1px solid var(--line); margin:3px 8px; padding:0; pointer-events:none;"; m.appendChild(it); return; }
    it.textContent = label;
    it.style.cssText = "padding:7px 16px; cursor:pointer; white-space:nowrap;";
    it.onmouseenter = () => it.style.background = "var(--accent-soft)";
    it.onmouseleave = () => it.style.background = "";
    it.onclick = () => { closeCtx(); fn(); };
    m.appendChild(it);
  });
  document.body.appendChild(m);
  // 贴边翻转：防菜单超出视口
  const r = m.getBoundingClientRect();
  let x = e.clientX, y = e.clientY;
  if (x + r.width > window.innerWidth - 6) x = window.innerWidth - r.width - 6;
  if (y + r.height > window.innerHeight - 6) y = window.innerHeight - r.height - 6;
  m.style.left = x + "px"; m.style.top = y + "px";
  ctxEl = m;
  setTimeout(() => {
    document.addEventListener("click", closeCtx, { once: true });
    document.addEventListener("contextmenu", closeCtx, { once: true });
  }, 0);
}
function closeCtx() { if (ctxEl) { ctxEl.remove(); ctxEl = null; } }
/* 编辑器右键菜单：格式操作 + 插入图片 */
$("editor").addEventListener("contextmenu", e => {
  e.preventDefault();
  const items = [
    ["✂ 剪切", () => document.execCommand("cut")],
    ["📋 复制", () => document.execCommand("copy")],
    ["📥 粘贴", () => { toast("请用 Ctrl+V 粘贴（浏览器安全限制）"); }],
    [null, null],
    ["🖍 高亮选中", () => { document.execCommand("styleWithCSS", false, true); document.execCommand("hiliteColor", false, "#fff3a3"); const p = findPage(); if (p) { p.html = $("editor").innerHTML; markDirty(true); } }],
    ["🖼 插入图片", () => $("btnImg").click()],
    ["⊞ 全选", () => document.execCommand("selectAll")],
  ];
  ctxMenu(e, items);
});
const stripTags = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent; };

/* ---------- Tab 缩进：无选区→两空格；Shift+Tab→outdent；有选区→indent ---------- */
$("editor").addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  e.preventDefault(); e.stopPropagation();
  const selEd = window.getSelection();
  if (e.shiftKey && !selEd.isCollapsed) {
    document.execCommand("outdent", false, null);
  } else if (e.shiftKey) {
    document.execCommand("outdent", false, null);
  } else if (selEd.isCollapsed) {
    document.execCommand("insertText", false, "  ");
  } else {
    document.execCommand("indent", false, null);
  }
  const p = findPage();
  if (p) { p.html = $("editor").innerHTML; markDirty(true); }
});

/* ---------- 图片尺寸调整：点击图片出现角柄，拖拽缩放 ---------- */
(function setupImageResize() {
  let activeImg = null, overlay = null, startX = 0, startY = 0, startW = 0, startH = 0, aspect = 1, resizing = false;
  const ed = $("editor");
  function showHandles(img) {
    removeHandles();
    const wrap = img.parentElement; if (!wrap) return;
    const r = img.getBoundingClientRect();
    const er = ed.getBoundingClientRect();
    const box = document.createElement("div");
    box.style.cssText = "position:fixed; border:1px solid var(--accent); pointer-events:none; z-index:50;" +
      "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;";
    const h = document.createElement("div");
    h.style.cssText = "position:absolute; right:-5px; bottom:-5px; width:10px; height:10px; background:var(--accent); border-radius:2px; cursor:nwse-resize; pointer-events:auto;";
    h.addEventListener("mousedown", ev => {
      ev.preventDefault(); ev.stopPropagation();
      resizing = true; startX = ev.screenX; startY = ev.screenY; startW = img.width; startH = img.height; aspect = img.height / img.width;
    });
    box.appendChild(h);
    overlay = box;
    document.body.appendChild(box);
  }
  function removeHandles() { if (overlay) { overlay.remove(); overlay = null; } }
  ed.addEventListener("click", e => {
    if (e.target.tagName === "IMG") {
      activeImg = e.target;
      showHandles(activeImg);
    } else { removeHandles(); activeImg = null; }
  });
  document.addEventListener("mousemove", e => {
    if (!resizing || !activeImg) return;
    const dx = e.screenX - startX;
    const w = Math.max(60, startW + dx);
    activeImg.style.width = w + "px";
    activeImg.style.height = (w * aspect) + "px";
    showHandles(activeImg);
  });
  document.addEventListener("mouseup", () => {
    if (resizing) {
      resizing = false;
      const p = findPage();
      if (p && p.html !== $("editor").innerHTML) { p.html = $("editor").innerHTML; markDirty(true); }
    }
  });
  // 图片样式默认
  const st = document.createElement("style");
  st.textContent = "#editor img{cursor:default; position:relative;}";
  document.head.appendChild(st);
})();


function renderEditor() {
  const p = findPage();
  if (!p) { $("editorWrap").style.display = "none"; $("emptyState").style.display = "flex"; $("emptyState").innerHTML = "<p>左侧选择或新建一页开始记录</p><button class='btn primary' id='btnNewPage'>➕ 新建页面</button>"; $("btnNewPage").onclick = addPage; return; }
  $("editorWrap").style.display = "flex"; $("emptyState").style.display = "none";
  $("pgTitle").value = p.title;
  $("editor").innerHTML = p.html;
}
const findPage = () => {
  const sec = findSec(sel.nb, sel.sec);
  return sec ? sec.pages.find(p => p.id === sel.pg) : null;
};
function addPage() {
  const sec = findSec(sel.nb, sel.sec);
  if (!sec) { toast("请先选中一个分区"); return; }
  const p = { id: uid(), title: "", html: "", created: Date.now(), updated: Date.now() };
  sec.pages.unshift(p);
  sel.pg = p.id; dirty = true; renderAll();
  $("pgTitle").focus();
}
function updateStatus() {
  const chip = lastSavedAt ? "✓ " + lastSavedAt.toTimeString().slice(0, 5) + (dirty ? " ●" : "") : (dirty ? "● 未保存" : "");
  $("saveChip").textContent = chip;
  if (serverMode) {
    $("stSave").textContent = "服务器模式：" + (serverFile || "未选择笔记本") + (lastSavedAt ? " · 上次保存 " + lastSavedAt.toTimeString().slice(0, 5) : "");
  } else {
    $("stSave").textContent = fileHandle
      ? "文件：" + fileHandle.name + (lastSavedAt ? " · 上次保存 " + lastSavedAt.toTimeString().slice(0, 5) : "")
      : ($("fileState").textContent !== "未打开文件" ? "文件：" + $("fileState").textContent + "（无写回句柄，请用导出备份）" : "尚未打开文件");
  }
  $("stDirty").textContent = dirty ? "● 有未写回改动" : "";
  $("stDirty").className = dirty ? "warn" : "";
  let cnt = 0;
  if (state) state.notebooks.forEach(nb => nb.sections.forEach(s => cnt += s.pages.length));
  $("stCount").textContent = state ? `笔记本 ${state.notebooks.length} · 页面 ${cnt}` : "";
}

/* ---------- 编辑 ---------- */
$("pgTitle").addEventListener("input", () => {
  const p = findPage(); if (!p) return;
  p.title = $("pgTitle").value; p.updated = Date.now(); markDirty(false);
});
$("editor").addEventListener("input", () => {
  const p = findPage(); if (!p) return;
  p.html = $("editor").innerHTML; p.updated = Date.now(); markDirty(false);
});
function markDirty(reschedule) {
  dirty = true; updateStatus();
  idbPut(JSON.stringify(state));               // 会话内镜像
  if (reschedule) scheduleSave();
}
// 输入防抖：停手 800ms 后延迟触发自动保存网格
let saveTimer = null;
function scheduleSave() {
  if (saveTimer) return;
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    if (dirty && fileHandle) saveToHandle(true);
  }, 30000);
}

/* toolbar 命令 */
document.querySelectorAll("#toolbar [data-cmd]").forEach(b => {
  b.onclick = () => {
    const cmd = b.dataset.cmd;
    $("editor").focus();
    if (cmd === "hiliteColor") document.execCommand("styleWithCSS", false, true), document.execCommand("hiliteColor", false, "#fff3a3");
    else if (cmd.startsWith("formatBlock:")) document.execCommand("formatBlock", false, cmd.split(":")[1]);
    else document.execCommand(cmd, false, null);
    const p = findPage();
    if (p) { p.html = $("editor").innerHTML; markDirty(true); }
  };
});
$("btnImg").onclick = () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const dataUrl = await compressImage(f);
    document.execCommand("insertHTML", false, "<img src='" + dataUrl + "'>");
    const p = findPage();
    if (p) { p.html = $("editor").innerHTML; markDirty(true); }
  };
  inp.click();
};
function compressImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1280;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { // 压缩失败退回原始读法
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
    };
    img.src = URL.createObjectURL(file);
  });
}
/* 粘贴图片 */
$("editor").addEventListener("paste", async e => {
  const items = [...(e.clipboardData || {}).items || []];
  const imgItem = items.find(i => i.type.startsWith("image/"));
  if (!imgItem) return;
  e.preventDefault();
  const blob = imgItem.getAsFile();
  const dataUrl = await compressImage(blob);
  document.execCommand("insertHTML", false, "<img src='" + dataUrl + "'>");
  const p = findPage();
  if (p) { p.html = $("editor").innerHTML; markDirty(true); }
});

/* 搜索 */
$("pgSearch").addEventListener("input", renderPages);
$("pgSearch").addEventListener("keydown", e => { if (e.key === "Enter") { const first = $("pgList").querySelector(".item"); if (first) first.click(); } });
/* 页面栏 ＋ 新建（不再需要先退出当前页） */
$("addPg").onclick = addPage;
/* 横幅关闭 */
$("handleClose").onclick = () => { $("handleBanner").style.display = "none"; };

/* Ctrl+S / Ctrl+N / Ctrl+Shift+S(导出) */
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "s") {
    e.preventDefault();
    if (state) {
      if (serverMode) saveActive(false);
      else ensureFileThen(() => saveActive(false));
    }
  }
  if ((e.ctrlKey || e.metaKey) && k === "n") {
    e.preventDefault();
    addPage();
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === "s") {
    e.preventDefault();
    if (state) exportDownload();
  }
});

/* 关闭前拦截未保存改动 */
window.addEventListener("beforeunload", e => {
  if (dirty || saveTimer) { e.preventDefault(); e.returnValue = ""; }
});

/* 30 秒自动保存（服务器模式或已有句柄时） */
setInterval(async () => {
  if (dirty && (fileHandle || (serverMode && serverFile))) await saveActive(true);
}, 30000);

/* ---------- 启动：服务器模式探测 + 草稿恢复检查 ---------- */
(async () => {
  // 探测服务器模式
  try {
    const r = await fetch("/api/ping", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j.ok && j.mode === "server") {
        serverMode = true;
        $("fileState").textContent = "服务器模式 · 数据目录 " + j.dataDir;
        $("handleBanner").style.display = "block";
        $("handleName").textContent = "（服务器模式：点「打开笔记本」列出/新建 .nbk）";
        $("handleRestore").textContent = "📂 选择笔记本";
        $("handleRestore").onclick = () => serverPickFile();
        $("handleForget").style.display = "none";
        updateStatus();
        return;
      }
    }
  } catch (e) { /* 非 http 或服务未起，走文件模式 */ }
  const draft = await idbGet();
  if (draft && state === null) {
    try {
      const obj = JSON.parse(draft);
      if (obj && obj.app === APP) {
        $("draftBanner").style.display = "block";
        $("draftRestore").onclick = () => { adoptState(obj, "上次草稿（未选文件）"); fileHandle = null; };
        $("draftDiscard").onclick = () => { $("draftBanner").style.display = "none"; idbPut(JSON.stringify({ app: "empty" })); };
      }
    } catch (e) { /* 忽略脏草稿 */ }
  }
})();
function initBlank() {
  state = { app: APP, ver: 1, notebooks: [] };   // 空壳，不塞默认笔记本（由调用方决定建什么）
  renderAll();
}
